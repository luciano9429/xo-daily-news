name: Test Telegram API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica token Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "Lunghezza token: ${#BOT_TOKEN}"
          echo "Inizio verifica API..."
          curl -sS -o risposta.txt -w "HTTP STATUS: %{http_code}\n" \
            "https://api.telegram.org/bot${BOT_TOKEN}/getMe"
          cat risposta.txt
