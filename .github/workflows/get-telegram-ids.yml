YAML
name: Test pubblicazione Telegram

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Invia messaggio nel topic
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=-1004476534522" \
            -d "message_thread_id=40" \
            --data-urlencode "text=✅ Test riuscito! Il bot XO Daily News è collegato correttamente al topic."
