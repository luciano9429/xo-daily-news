name: Recupera ID Telegram

on:
  workflow_dispatch:

jobs:
  get-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Leggi aggiornamenti Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          response=$(curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates")
          echo "$response" | jq -r '
            if .ok == false then
              "ERRORE: \(.description)"
            else
              .result[]? |
              select(.message != null) |
              "TESTO: \(.message.text // "senza testo")\nID GRUPPO: \(.message.chat.id)\nID TOPIC: \(.message.message_thread_id // "non trovato")"
            end
          '
