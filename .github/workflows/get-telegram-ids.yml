name: Recupera ID Telegram

on:
  workflow_dispatch:

jobs:
  get-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica lettura secret
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "ERRORE: BOT_TOKEN non viene letto"
            exit 1
          else
            echo "OK: BOT_TOKEN viene letto"
          fi
