
name: XO Daily News

'on':
  schedule:
    - cron: '0 7,8 * * *'
  workflow_dispatch:

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          python -m pip install requests feedparser beautifulsoup4 yt-dlp

      - name: Cerca e pubblica XO Daily News
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cat > daily.py <<'PY'
          import os, re, html, json, time, subprocess
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from urllib.parse import quote
          import requests
          import feedparser
          from bs4 import BeautifulSoup

          CHAT_ID = "-1004476534522"
          TOPIC_ID = 40
          TZ = ZoneInfo("Europe/Rome")
          NOW = datetime.now(TZ)
          HEADERS = {"User-Agent": "Mozilla/5.0 (compatible; XODailyNews/1.0)"}
          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)

          def get(url, **kwargs):
              for attempt in range(3):
                  try:
                      r = SESSION.get(url, timeout=20, **kwargs)
                      r.raise_for_status()
                      return r
                  except Exception as e:
                      print(f"GET tentativo {attempt+1}: {e}")
                      time.sleep(2)
              return None

          def translate(text):
              if not text:
                  return ""
              try:
                  url = "https://translate.googleapis.com/translate_a/single"
                  params = {"client":"gtx","sl":"auto","tl":"it","dt":"t","q":text[:3500]}
                  r = get(url, params=params)
                  if r:
                      data = r.json()
                      return "".join(x[0] for x in data[0] if x[0])
              except Exception as e:
                  print("Traduzione non disponibile:", e)
              return text

          def clean(text):
              return re.sub(r"\s+", " ", html.unescape(text or "")).strip()

          def article_summary(url, fallback):
              r = get(url)
              if not r:
                  return ""
              try:
                  soup = BeautifulSoup(r.text, "html.parser")
                  for tag in soup(["script","style","nav","footer","header","aside","form"]):
                      tag.decompose()

                  candidates = []
                  for selector in ["article", '[itemprop="articleBody"]', "main"]:
                      el = soup.select_one(selector)
                      if el:
                          candidates.append(el.get_text(" ", strip=True))

                  if not candidates:
                      candidates.append(soup.get_text(" ", strip=True))

                  text = max(candidates, key=len)
                  text = clean(text)
                  if len(text) < 250:
                      return ""

                  title = clean(soup.title.get_text() if soup.title else "")
                  if title and text.startswith(title):
                      text = text[len(title):].strip()

                  text = re.sub(r"Cookie preferences|Accept all cookies|Privacy policy", "", text, flags=re.I)
                  text = clean(text)

                  if len(text) < 250:
                      return ""

                  summary = text[:1100]
                  summary = translate(summary)
                  return summary[:650].rsplit(" ", 1)[0] + "…" if len(summary) > 650 else summary
              except Exception as e:
                  print("Errore lettura articolo:", e)
                  return ""

          def news():
              queries = [
                  '"The Weeknd" OR "Abel Tesfaye"',
                  '"The Weeknd" interview OR tour OR music',
                  '"The Weeknd" Italia OR concerto OR musica'
              ]
              found = {}
              cutoff = datetime.now(timezone.utc) - timedelta(hours=48)

              for q in queries:
                  url = "https://news.google.com/rss/search?q=" + quote(q + " when:2d") + "&hl=en-US&gl=US&ceid=US:en"
                  r = get(url)
                  if not r:
                      continue
                  feed = feedparser.parse(r.content)

                  for entry in feed.entries:
                      title = clean(entry.get("title", ""))
                      link = entry.get("link", "")
                      desc = clean(BeautifulSoup(entry.get("summary", ""), "html.parser").get_text(" "))
                      if not title or not link:
                          continue

                      combined = (title + " " + desc).lower()
                      if not any(x in combined for x in ["the weeknd", "abel tesfaye"]):
                          continue

                      published = entry.get("published_parsed")
                      if published:
                          from time import mktime
                          dt = datetime.fromtimestamp(mktime(published), timezone.utc)
                          if dt < cutoff:
                              continue

                      key = re.sub(r"[^a-z0-9]", "", title.lower())
                      if key not in found:
                          found[key] = {
                              "title": title,
                              "link": link,
                              "source": clean(entry.get("source", {}).get("title", "Fonte non indicata")),
                              "description": desc
                          }

              results = []
              for item in found.values():
                  if len(results) >= 5:
                      break
                  summary = article_summary(item["link"], item["description"])
                  if not summary:
                      summary = translate(item["description"])
                  if summary and any(x in summary.lower() for x in [
                      "google news", "aggregated from sources", "copertura di notizie aggiornata",
                      "aggregata da fonti di tutto il mondo"
                  ]):
                      summary = ""
                  item["summary"] = summary
                  results.append(item)

              return results

          def youtube():
              queries = [
                  "The Weeknd interview",
                  "The Weeknd live performance",
                  "The Weeknd music video",
                  "Abel Tesfaye interview"
              ]
              videos = {}
              cutoff = datetime.now(timezone.utc) - timedelta(hours=24)

              for q in queries:
                  try:
                      cmd = [
                          "yt-dlp", "--flat-playlist", "--dump-single-json",
                          "--no-warnings", "--ignore-errors", "--playlist-end", "8",
                          "ytsearch8:" + q
                      ]
                      p = subprocess.run(cmd, capture_output=True, text=True, timeout=60)
                      if p.returncode != 0 and not p.stdout:
                          print("Ricerca YouTube non riuscita:", p.stderr[-500:])
                          continue

                      data = json.loads(p.stdout)
                      for v in data.get("entries", []):
                          if not v:
                              continue
                          title = clean(v.get("title", ""))
                          channel = clean(v.get("channel", "") or v.get("uploader", ""))
                          vid = v.get("id", "")
                          date = v.get("upload_date", "")

                          if not vid or not date:
                              continue
                          if not any(x in (title + " " + channel).lower()
                                     for x in ["weeknd", "abel tesfaye", "xo"]):
                              continue

                          try:
                              dt = datetime.strptime(date, "%Y%m%d").replace(tzinfo=timezone.utc)
                          except Exception:
                              continue

                          if dt < cutoff:
                              continue

                          videos[vid] = {
                              "title": title,
                              "channel": channel,
                              "url": "https://www.youtube.com/watch?v=" + vid
                          }
                  except Exception as e:
                      print("Errore YouTube:", e)

              return list(videos.values())[:8]

          def escape(s):
              return html.escape(str(s), quote=False)

          def build_message(articles, videos):
              lines = [
                  "📰 <b>XO DAILY NEWS</b>",
                  "Le ultime notizie su The Weeknd",
                  ""
              ]

              if articles:
                  for i, a in enumerate(articles, 1):
                      lines.append(f"<b>{i}. {escape(a['title'])}</b>")
                      lines.append("Fonte: " + escape(a["source"]))
                      if a["summary"]:
                          lines.append(escape(a["summary"]))
                      lines.append(f'<a href="{html.escape(a["link"], quote=True)}">Leggi la notizia</a>')
                      lines.append("")
              else:
                  lines.extend(["Nessuna nuova notizia pertinente nelle ultime 48 ore.", ""])

              lines.extend(["🎬 <b>NUOVI VIDEO YOUTUBE</b>", ""])
              if videos:
                  for v in videos:
                      lines.append(f'• <a href="{html.escape(v["url"], quote=True)}">{escape(v["title"])}</a>')
                      lines.append("Canale: " + escape(v["channel"]))
              else:
                  lines.append("Nessun nuovo video pertinente nelle ultime 24 ore.")

              lines.extend([
                  "",
                  "📸 <b>INSTAGRAM</b>",
                  '<a href="https://www.instagram.com/theweeknd/">Profilo ufficiale @theweeknd</a>',
                  '<a href="https://www.instagram.com/abelspost/">Fanpage @abelspost</a>'
              ])
              return "\n".join(lines)

          def send(message):
              url = f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage"
              payload = {
                  "chat_id": CHAT_ID,
                  "message_thread_id": TOPIC_ID,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }
              for attempt in range(3):
                  try:
                      r = requests.post(url, data=payload, timeout=30)
                      print("Telegram:", r.status_code, r.text[:500])
                      r.raise_for_status()
                      if not r.json().get("ok"):
                          raise RuntimeError(r.text)
                      return
                  except Exception as e:
                      print(f"Invio Telegram tentativo {attempt+1}: {e}")
                      time.sleep(3)
              raise RuntimeError("Invio Telegram fallito dopo 3 tentativi")

          if os.getenv("GITHUB_EVENT_NAME") == "schedule" and NOW.hour != 9:
              print("Non sono le 09:00 in Italia: salto l'esecuzione.")
              raise SystemExit(0)

          print("Ricerca notizie...")
          articles = news()
          print("Notizie trovate:", len(articles))

          print("Ricerca video YouTube...")
          videos = youtube()
          print("Video trovati:", len(videos))

          message = build_message(articles, videos)
          send(message)
          print("XO Daily News pubblicato correttamente.")
          PY

          python daily.py
