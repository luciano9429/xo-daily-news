
name: XO Daily News

'on':
  schedule:
    - cron: '0 7,8 * * *'
  workflow_dispatch:

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          python -m pip install requests feedparser beautifulsoup4 yt-dlp

      - name: Cerca e pubblica XO Daily News
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cat > daily.py <<'PY'
          import os
          import re
          import html
          import json
          import time
          import subprocess
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          import requests
          import feedparser
          from bs4 import BeautifulSoup

          CHAT_ID = "-1004476534522"
          TOPIC_ID = 40
          NOW = datetime.now(ZoneInfo("Europe/Rome"))
          UTC_NOW = datetime.now(timezone.utc)

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 Chrome/120 Safari/537.36"
              )
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)

          CUTOFF_NEWS = UTC_NOW - timedelta(days=7)
          CUTOFF_VIDEO = UTC_NOW - timedelta(hours=48)

          RSS_FEEDS = {
              "Pitchfork": "https://pitchfork.com/feed/feed-news/rss",
              "Billboard": "https://www.billboard.com/feed/",
              "Rolling Stone": "https://www.rollingstone.com/music/music-news/feed/",
          }

          YOUTUBE_OFFICIAL = (
              "https://www.youtube.com/feeds/videos.xml"
              "?channel_id=UC0WP5P-ufpRfjbNrmOWwLBQ"
          )

          def clean(value):
              return re.sub(
                  r"\s+", " ",
                  html.unescape(str(value or ""))
              ).strip()

          def get(url, timeout=25):
              for attempt in range(3):
                  try:
                      response = SESSION.get(
                          url,
                          timeout=timeout,
                          allow_redirects=True
                      )
                      response.raise_for_status()
                      return response
                  except Exception as e:
                      print(
                          f"Errore GET tentativo {attempt + 1}: {e}"
                      )
                      time.sleep(2)
              return None

          def translate(text):
              if not text:
                  return ""

              try:
                  response = SESSION.get(
                      "https://translate.googleapis.com/translate_a/single",
                      params={
                          "client": "gtx",
                          "sl": "auto",
                          "tl": "it",
                          "dt": "t",
                          "q": text[:4500]
                      },
                      timeout=25
                  )
                  response.raise_for_status()
                  data = response.json()

                  return clean("".join(
                      part[0]
                      for part in data[0]
                      if part[0]
                  ))
              except Exception as e:
                  print("Traduzione non disponibile:", e)
                  return text

          def parse_date(entry):
              for field in ("published_parsed", "updated_parsed"):
                  value = entry.get(field)
                  if value:
                      try:
                          return datetime(
                              *value[:6],
                              tzinfo=timezone.utc
                          )
                      except Exception:
                          pass
              return None

          def article_text(url):
              response = get(url)
              if not response:
                  return ""

              soup = BeautifulSoup(
                  response.text,
                  "html.parser"
              )

              # Prima prova: dati strutturati JSON-LD.
              for script in soup.find_all(
                  "script",
                  type="application/ld+json"
              ):
                  try:
                      data = json.loads(script.string or script.get_text())
                      objects = data if isinstance(data, list) else [data]

                      for obj in objects:
                          if not isinstance(obj, dict):
                              continue

                          if obj.get("@graph"):
                              objects.extend(obj["@graph"])

                          body = obj.get("articleBody")
                          if body and len(clean(body)) > 200:
                              return clean(body)

                  except Exception:
                      continue

              # Seconda prova: paragrafi del contenuto editoriale.
              for selector in [
                  "article",
                  '[itemprop="articleBody"]',
                  ".article-content",
                  ".story-content",
                  ".post-content",
                  "main"
              ]:
                  container = soup.select_one(selector)
                  if not container:
                      continue

                  paragraphs = [
                      clean(p.get_text(" ", strip=True))
                      for p in container.find_all("p")
                  ]

                  paragraphs = [
                      p for p in paragraphs
                      if len(p) > 45
                  ]

                  text = clean(" ".join(paragraphs))

                  if len(text) > 250:
                      return text[:7000]

              # Ultima possibilità: metadati descrittivi.
              for attr in [
                  {"property": "og:description"},
                  {"name": "description"},
                  {"name": "twitter:description"}
              ]:
                  tag = soup.find("meta", attrs=attr)
                  if tag and tag.get("content"):
                      value = clean(tag["content"])
                      if len(value) > 100:
                          return value

              return ""

          def relevant(title):
              title = clean(title).lower()

              if (
                  "the weeknd" not in title
                  and "abel tesfaye" not in title
              ):
                  return False

              excluded = [
                  "stellar blade",
                  "shift up",
                  "playstation",
                  "xbox",
                  "nintendo",
                  "video game",
                  "gaming"
              ]

              return not any(x in title for x in excluded)

          def summarize(text):
              text = clean(text)

              if len(text) < 120:
                  return ""

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              selected = []

              for sentence in sentences:
                  sentence = clean(sentence)

                  if len(sentence) < 40:
                      continue

                  if any(x in sentence.lower() for x in [
                      "cookie policy",
                      "privacy policy",
                      "terms of service",
                      "subscribe to our newsletter",
                      "sign up for our newsletter",
                      "advertisement"
                  ]):
                      continue

                  selected.append(sentence)

                  if len(" ".join(selected)) >= 1000:
                      break

              if not selected:
                  return ""

              result = translate(
                  " ".join(selected)[:4000]
              )

              if len(result) < 100:
                  return ""

              if len(result) > 750:
                  result = result[:750].rsplit(" ", 1)[0] + "…"

              return result

          def get_news():
              found = {}

              for source, feed_url in RSS_FEEDS.items():
                  print("Controllo feed:", source)

                  response = get(feed_url)
                  if not response:
                      print("Feed non disponibile:", source)
                      continue

                  feed = feedparser.parse(response.content)

                  print(
                      source,
                      "articoli:",
                      len(feed.entries),
                      "errore feed:",
                      feed.bozo
                  )

                  for entry in feed.entries:
                      title = clean(entry.get("title", ""))
                      link = entry.get("link", "")

                      if not title or not link:
                          continue

                      if not relevant(title):
                          continue

                      date = parse_date(entry)

                      if date and date < CUTOFF_NEWS:
                          continue

                      key = re.sub(
                          r"[^a-z0-9]",
                          "",
                          title.lower()
                      )

                      description = clean(
                          BeautifulSoup(
                              entry.get("summary", ""),
                              "html.parser"
                          ).get_text(" ", strip=True)
                      )

                      if key not in found:
                          found[key] = {
                              "title": title,
                              "link": link,
                              "source": source,
                              "description": description,
                              "date": date
                          }

                      elif len(description) > len(
                          found[key]["description"]
                      ):
                          found[key]["description"] = description

              articles = list(found.values())

              articles.sort(
                  key=lambda x: x["date"] or datetime.min.replace(
                      tzinfo=timezone.utc
                  ),
                  reverse=True
              )

              results = []

              for article in articles[:5]:
                  print(
                      "Apro articolo:",
                      article["title"]
                  )

                  full_text = article_text(article["link"])

                  if len(full_text) > len(article["description"]):
                      article["description"] = full_text

                  article["summary"] = summarize(
                      article["description"]
                  )

                  results.append(article)

              return results

          def get_official_youtube():
              print("Controllo feed YouTube ufficiale...")

              response = get(YOUTUBE_OFFICIAL)

              if not response:
                  print("Feed YouTube ufficiale non raggiungibile.")
                  return []

              feed = feedparser.parse(response.content)
              videos = []

              for entry in feed.entries:
                  title = clean(entry.get("title", ""))
                  link = entry.get("link", "")

                  published = entry.get("published_parsed")

                  if not title or not link or not published:
                      continue

                  date = datetime(
                      *published[:6],
                      tzinfo=timezone.utc
                  )

                  if date < CUTOFF_VIDEO:
                      continue

                  videos.append({
                      "title": title,
                      "channel": "The Weeknd - Canale ufficiale",
                      "url": link,
                      "date": date
                  })

              return videos

          def get_other_youtube():
              queries = [
                  "The Weeknd interview",
                  "The Weeknd live performance",
                  "Abel Tesfaye interview"
              ]

              videos = {}

              for query in queries:
                  print("Ricerca video aggiuntiva:", query)

                  try:
                      command = [
                          "yt-dlp",
                          "--dump-json",
                          "--flat-playlist",
                          "--no-warnings",
                          "--ignore-errors",
                          "--playlist-end", "8",
                          "ytsearch8:" + query
                      ]

                      process = subprocess.run(
                          command,
                          capture_output=True,
                          text=True,
                          timeout=60
                      )

                      for line in process.stdout.splitlines():
                          try:
                              video = json.loads(line)
                          except Exception:
                              continue

                          title = clean(video.get("title", ""))
                          channel = clean(
                              video.get("channel", "")
                              or video.get("uploader", "")
                          )

                          video_id = video.get("id", "")

                          if not video_id:
                              continue

                          combined = (
                              title + " " + channel
                          ).lower()

                          if not any(x in combined for x in [
                              "the weeknd",
                              "abel tesfaye"
                          ]):
                              continue

                          upload_date = video.get("upload_date")

                          if upload_date:
                              try:
                                  date = datetime.strptime(
                                      upload_date,
                                      "%Y%m%d"
                                  ).replace(tzinfo=timezone.utc)

                                  if date < CUTOFF_VIDEO:
                                      continue
                              except Exception:
                                  pass

                          videos[video_id] = {
                              "title": title,
                              "channel": channel,
                              "url": (
                                  "https://www.youtube.com/watch?v="
                                  + video_id
                              ),
                              "date": None
                          }

                  except Exception as e:
                      print("Ricerca YouTube supplementare fallita:", e)

                  time.sleep(2)

              return list(videos.values())

          def get_videos():
              official = get_official_youtube()
              extra = get_other_youtube()

              combined = {}
              for video in official + extra:
                  key = video["url"].split("v=")[-1]
                  combined[key] = video

              return list(combined.values())[:8]

          def esc(value):
              return html.escape(str(value), quote=False)

          def build_message(articles, videos):
              lines = [
                  "📰 <b>XO DAILY NEWS</b>",
                  "Le ultime notizie su The Weeknd",
                  ""
              ]

              if articles:
                  for i, article in enumerate(articles, 1):
                      lines.append(
                          f"<b>{i}. {esc(article['title'])}</b>"
                      )

                      lines.append(
                          "Fonte: " + esc(article["source"])
                      )

                      if article["summary"]:
                          lines.append(
                              esc(article["summary"])
                          )
                      else:
                          lines.append(
                              "Testo completo non recuperabile automaticamente."
                          )

                      lines.append(
                          '<a href="'
                          + html.escape(article["link"], quote=True)
                          + '">Leggi la notizia</a>'
                      )
                      lines.append("")
              else:
                  lines.extend([
                      "Nessuna nuova notizia pertinente trovata nei feed RSS negli ultimi 7 giorni.",
                      ""
                  ])

              lines.extend([
                  "🎬 <b>NUOVI VIDEO YOUTUBE</b>",
                  ""
              ])

              if videos:
                  for video in videos:
                      lines.append(
                          '• <a href="'
                          + html.escape(video["url"], quote=True)
                          + '">'
                          + esc(video["title"])
                          + '</a>'
                      )

                      if video["channel"]:
                          lines.append(
                              "Canale: " + esc(video["channel"])
                          )
              else:
                  lines.append(
                      "Nessun video recente recuperato dai feed e dalla ricerca."
                  )

              lines.extend([
                  "",
                  "📸 <b>INSTAGRAM</b>",
                  '<a href="https://www.instagram.com/theweeknd/">Profilo ufficiale @theweeknd</a>',
                  '<a href="https://www.instagram.com/abelspost/">Fanpage @abelspost</a>'
              ])

              return "\n".join(lines)

          def send_telegram(message):
              url = (
                  "https://api.telegram.org/bot"
                  + os.environ["BOT_TOKEN"]
                  + "/sendMessage"
              )

              payload = {
                  "chat_id": CHAT_ID,
                  "message_thread_id": TOPIC_ID,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }

              for attempt in range(3):
                  try:
                      response = requests.post(
                          url,
                          data=payload,
                          timeout=30
                      )

                      print(
                          "Telegram:",
                          response.status_code,
                          response.text[:500]
                      )

                      response.raise_for_status()

                      if not response.json().get("ok"):
                          raise RuntimeError(response.text)

                      return

                  except Exception as e:
                      print("Errore invio:", e)
                      time.sleep(3)

              raise RuntimeError("Invio Telegram fallito.")

          if (
              os.getenv("GITHUB_EVENT_NAME") == "schedule"
              and NOW.hour != 9
          ):
              print("Orario non previsto: salto.")
              raise SystemExit(0)

          print("Avvio XO Daily News...")
          articles = get_news()
          print("Notizie:", len(articles))

          videos = get_videos()
          print("Video:", len(videos))

          message = build_message(articles, videos)
          send_telegram(message)

          print("Pubblicazione completata.")
          PY

          python daily.py
