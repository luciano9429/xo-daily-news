
name: XO Daily News

'on':
  schedule:
    - cron: '0 7,8 * * *'
  workflow_dispatch:

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          python -m pip install requests feedparser beautifulsoup4 yt-dlp

      - name: Cerca e pubblica XO Daily News
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cat > daily.py <<'PY'
          import os
          import re
          import html
          import json
          import time
          import subprocess
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from email.utils import parsedate_to_datetime

          import requests
          import feedparser
          from bs4 import BeautifulSoup

          CHAT_ID = "-1004476534522"
          TOPIC_ID = 40
          TZ = ZoneInfo("Europe/Rome")
          NOW = datetime.now(TZ)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)

          RSS_FEEDS = {
              "Billboard": "https://www.billboard.com/c/music/music-news/feed/",
              "Rolling Stone": "https://www.rollingstone.com/music/rss/",
              "Pitchfork": "https://pitchfork.com/rss/news/",
          }

          def clean(text):
              return re.sub(
                  r"\s+",
                  " ",
                  html.unescape(str(text or ""))
              ).strip()

          def get(url, **kwargs):
              for attempt in range(3):
                  try:
                      response = SESSION.get(
                          url,
                          timeout=25,
                          allow_redirects=True,
                          **kwargs
                      )
                      response.raise_for_status()
                      return response
                  except Exception as e:
                      print(f"GET tentativo {attempt + 1}: {e}")
                      time.sleep(2)
              return None

          def translate(text):
              if not text:
                  return ""

              try:
                  url = "https://translate.googleapis.com/translate_a/single"
                  params = {
                      "client": "gtx",
                      "sl": "auto",
                      "tl": "it",
                      "dt": "t",
                      "q": text[:3500]
                  }

                  response = get(url, params=params)

                  if response:
                      data = response.json()
                      return "".join(
                          part[0]
                          for part in data[0]
                          if part[0]
                      )

              except Exception as e:
                  print("Traduzione non disponibile:", e)

              return text

          def get_entry_text(entry):
              parts = []

              summary = entry.get("summary", "")
              if summary:
                  parts.append(
                      BeautifulSoup(
                          summary,
                          "html.parser"
                      ).get_text(" ", strip=True)
                  )

              for content in entry.get("content", []):
                  value = content.get("value", "")
                  if value:
                      parts.append(
                          BeautifulSoup(
                              value,
                              "html.parser"
                          ).get_text(" ", strip=True)
                      )

              return clean(" ".join(parts))

          def get_date(entry):
              value = entry.get("published") or entry.get("updated")

              if not value:
                  return None

              try:
                  date = parsedate_to_datetime(value)

                  if date.tzinfo is None:
                      date = date.replace(tzinfo=timezone.utc)

                  return date.astimezone(timezone.utc)

              except Exception:
                  return None

          def relevant(title, description):
              title = clean(title).lower()
              description = clean(description).lower()

              # Il nome deve essere nel titolo.
              if (
                  "the weeknd" not in title
                  and "abel tesfaye" not in title
              ):
                  return False

              excluded = [
                  "stellar blade",
                  "shift up",
                  "playstation",
                  "xbox",
                  "nintendo",
                  "gaming",
                  "video game"
              ]

              if any(word in title for word in excluded):
                  return False

              return True

          def make_summary(text, title):
              text = clean(text)

              if len(text) < 100:
                  return ""

              # Rimuove descrizioni generiche e duplicazioni.
              generic = [
                  "google news",
                  "aggregated from sources",
                  "subscribe to our newsletter",
                  "sign up for our newsletter",
                  "read more",
                  "click here"
              ]

              if any(word in text.lower() for word in generic):
                  return ""

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              selected = []
              title_lower = clean(title).lower()

              for sentence in sentences:
                  sentence = clean(sentence)

                  if len(sentence) < 40:
                      continue

                  if sentence.lower() == title_lower:
                      continue

                  if any(word in sentence.lower() for word in [
                      "cookie policy",
                      "privacy policy",
                      "terms of service",
                      "advertisement",
                      "subscribe now"
                  ]):
                      continue

                  selected.append(sentence)

                  if len(" ".join(selected)) >= 600:
                      break

              if not selected:
                  return ""

              summary = translate(
                  " ".join(selected)[:2500]
              )

              summary = clean(summary)

              if len(summary) < 90:
                  return ""

              if len(summary) > 650:
                  summary = (
                      summary[:650].rsplit(" ", 1)[0] + "…"
                  )

              return summary

          def news():
              found = {}

              cutoff = (
                  datetime.now(timezone.utc)
                  - timedelta(hours=48)
              )

              for source, feed_url in RSS_FEEDS.items():
                  print("Controllo feed:", source)

                  response = get(feed_url)

                  if not response:
                      print("Feed non raggiungibile:", source)
                      continue

                  feed = feedparser.parse(response.content)

                  print(
                      source,
                      "articoli nel feed:",
                      len(feed.entries)
                  )

                  for entry in feed.entries:
                      title = clean(entry.get("title", ""))
                      link = entry.get("link", "")
                      description = get_entry_text(entry)

                      if not title or not link:
                          continue

                      if not relevant(title, description):
                          continue

                      date = get_date(entry)

                      if date and date < cutoff:
                          continue

                      key = re.sub(
                          r"[^a-z0-9]",
                          "",
                          title.lower()
                      )

                      if key not in found:
                          found[key] = {
                              "title": title,
                              "link": link,
                              "source": source,
                              "description": description,
                              "date": date
                          }

                      elif len(description) > len(
                          found[key]["description"]
                      ):
                          found[key]["description"] = description

              # Prima gli articoli più recenti.
              articles = list(found.values())

              articles.sort(
                  key=lambda x: x["date"] or datetime.min.replace(
                      tzinfo=timezone.utc
                  ),
                  reverse=True
              )

              results = []

              for item in articles:
                  if len(results) >= 5:
                      break

                  print(
                      "Elaboro articolo:",
                      item["title"],
                      "| Fonte:",
                      item["source"]
                  )

                  summary = make_summary(
                      item["description"],
                      item["title"]
                  )

                  item["summary"] = summary
                  results.append(item)

              return results

          def youtube():
              queries = [
                  "The Weeknd interview",
                  "The Weeknd live performance",
                  "The Weeknd music video",
                  "Abel Tesfaye interview"
              ]

              videos = {}

              cutoff = (
                  datetime.now(timezone.utc)
                  - timedelta(hours=24)
              )

              for query in queries:
                  try:
                      command = [
                          "yt-dlp",
                          "--flat-playlist",
                          "--dump-single-json",
                          "--no-warnings",
                          "--ignore-errors",
                          "--playlist-end",
                          "8",
                          "ytsearch8:" + query
                      ]

                      process = subprocess.run(
                          command,
                          capture_output=True,
                          text=True,
                          timeout=60
                      )

                      if not process.stdout:
                          print(
                              "Nessun risultato YouTube:",
                              query
                          )
                          continue

                      data = json.loads(process.stdout)

                      for video in data.get("entries", []):
                          if not video:
                              continue

                          title = clean(
                              video.get("title", "")
                          )

                          channel = clean(
                              video.get("channel", "")
                              or video.get("uploader", "")
                          )

                          video_id = video.get("id", "")
                          upload_date = video.get(
                              "upload_date",
                              ""
                          )

                          if not video_id or not upload_date:
                              continue

                          combined = (
                              title + " " + channel
                          ).lower()

                          if not any(term in combined for term in [
                              "weeknd",
                              "abel tesfaye",
                              "xo"
                          ]):
                              continue

                          try:
                              date = datetime.strptime(
                                  upload_date,
                                  "%Y%m%d"
                              ).replace(tzinfo=timezone.utc)
                          except Exception:
                              continue

                          if date < cutoff:
                              continue

                          videos[video_id] = {
                              "title": title,
                              "channel": channel,
                              "url": (
                                  "https://www.youtube.com/watch?v="
                                  + video_id
                              )
                          }

                  except Exception as e:
                      print("Errore YouTube:", e)

              return list(videos.values())[:8]

          def escape(text):
              return html.escape(
                  str(text),
                  quote=False
              )

          def build_message(articles, videos):
              lines = [
                  "📰 <b>XO DAILY NEWS</b>",
                  "Le ultime notizie su The Weeknd",
                  ""
              ]

              if articles:
                  for index, article in enumerate(
                      articles,
                      1
                  ):
                      lines.append(
                          f"<b>{index}. {escape(article['title'])}</b>"
                      )

                      lines.append(
                          "Fonte: " + escape(article["source"])
                      )

                      if article["summary"]:
                          lines.append(
                              escape(article["summary"])
                          )
                      else:
                          lines.append(
                              "Descrizione editoriale non disponibile."
                          )

                      lines.append(
                          '<a href="'
                          + html.escape(
                              article["link"],
                              quote=True
                          )
                          + '">Leggi la notizia</a>'
                      )

                      lines.append("")

              else:
                  lines.extend([
                      "Nessuna nuova notizia pertinente nelle ultime 48 ore.",
                      ""
                  ])

              lines.extend([
                  "🎬 <b>NUOVI VIDEO YOUTUBE</b>",
                  ""
              ])

              if videos:
                  for video in videos:
                      lines.append(
                          '• <a href="'
                          + html.escape(
                              video["url"],
                              quote=True
                          )
                          + '">'
                          + escape(video["title"])
                          + '</a>'
                      )

                      lines.append(
                          "Canale: " + escape(video["channel"])
                      )

              else:
                  lines.append(
                      "Nessun nuovo video pertinente nelle ultime 24 ore."
                  )

              lines.extend([
                  "",
                  "📸 <b>INSTAGRAM</b>",
                  '<a href="https://www.instagram.com/theweeknd/">Profilo ufficiale @theweeknd</a>',
                  '<a href="https://www.instagram.com/abelspost/">Fanpage @abelspost</a>'
              ])

              return "\n".join(lines)

          def send(message):
              url = (
                  "https://api.telegram.org/bot"
                  + os.environ["BOT_TOKEN"]
                  + "/sendMessage"
              )

              payload = {
                  "chat_id": CHAT_ID,
                  "message_thread_id": TOPIC_ID,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }

              for attempt in range(3):
                  try:
                      response = requests.post(
                          url,
                          data=payload,
                          timeout=30
                      )

                      print(
                          "Telegram:",
                          response.status_code,
                          response.text[:500]
                      )

                      response.raise_for_status()

                      if not response.json().get("ok"):
                          raise RuntimeError(response.text)

                      return

                  except Exception as e:
                      print(
                          f"Invio Telegram tentativo {attempt + 1}:",
                          e
                      )
                      time.sleep(3)

              raise RuntimeError(
                  "Invio Telegram fallito dopo 3 tentativi"
              )

          if (
              os.getenv("GITHUB_EVENT_NAME") == "schedule"
              and NOW.hour != 9
          ):
              print(
                  "Non sono le 09:00 in Italia: salto l'esecuzione."
              )
              raise SystemExit(0)

          print("Ricerca notizie tramite RSS diretti...")
          articles = news()
          print("Notizie trovate:", len(articles))

          print("Ricerca video YouTube...")
          videos = youtube()
          print("Video trovati:", len(videos))

          message = build_message(
              articles,
              videos
          )

          send(message)

          print("XO Daily News pubblicato correttamente.")
          PY

          python daily.py
