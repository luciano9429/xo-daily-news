name: XO Daily News

'on':
  schedule:
    - cron: '0 7,8 * * *'
  workflow_dispatch:

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Cerca e pubblica le notizie
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: '-1004476534522'
          THREAD_ID: '40'
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import html
          import difflib
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from email.utils import parsedate_to_datetime
          from html.parser import HTMLParser

          now = datetime.now(ZoneInfo("Europe/Rome"))

          if os.environ["EVENT_NAME"] == "schedule" and now.hour != 9:
              print("Non sono le 09:00 italiane: nessun invio.")
              raise SystemExit(0)

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)

          def clean(text):
              parser = TextExtractor()
              parser.feed(text or "")
              return re.sub(
                  r"\s+", " ", " ".join(parser.parts)
              ).strip()

          def translate(text):
              if not text:
                  return ""

              try:
                  params = urllib.parse.urlencode({
                      "client": "gtx",
                      "sl": "auto",
                      "tl": "it",
                      "dt": "t",
                      "q": text[:1000]
                  })

                  url = (
                      "https://translate.googleapis.com/"
                      "translate_a/single?" + params
                  )

                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.loads(response.read().decode())

                  return "".join(
                      part[0] for part in data[0] if part[0]
                  )

              except Exception:
                  return text

          def similar(a, b):
              return difflib.SequenceMatcher(
                  None, a.casefold(), b.casefold()
              ).ratio() > 0.72

          query = '"The Weeknd" OR "Abel Tesfaye" when:2d'

          params = urllib.parse.urlencode({
              "q": query,
              "hl": "it",
              "gl": "IT",
              "ceid": "IT:it"
          })

          feed_url = (
              "https://news.google.com/rss/search?" + params
          )

          req = urllib.request.Request(
              feed_url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=25) as response:
              root = ET.fromstring(response.read())

          cutoff = datetime.now(timezone.utc) - timedelta(hours=48)
          articles = []
          seen = set()

          for item in root.findall(".//item"):
              title = clean(item.findtext("title", ""))
              description = clean(item.findtext("description", ""))
              link = item.findtext("link", "")
              pubdate = item.findtext("pubDate", "")

              source_element = item.find("source")
              source = (
                  clean(source_element.text)
                  if source_element is not None else ""
              )

              searchable = (
                  title + " " + description
              ).casefold()

              if (
                  "the weeknd" not in searchable
                  and "abel tesfaye" not in searchable
              ):
                  continue

              if not title or not link:
                  continue

              try:
                  date = parsedate_to_datetime(pubdate)

                  if date.tzinfo is None:
                      date = date.replace(tzinfo=timezone.utc)

                  if date < cutoff:
                      continue

              except Exception:
                  continue

              key = title.casefold()

              if key in seen:
                  continue

              seen.add(key)

              # Rimuove il nome della testata dal titolo.
              clean_title = re.sub(
                  r"\s+-\s+[^-]{2,60}$", "", title
              ).strip()

              articles.append({
                  "date": date,
                  "title": clean_title,
                  "description": description,
                  "source": source,
                  "link": link
              })

          articles.sort(
              key=lambda article: article["date"],
              reverse=True
          )

          articles = articles[:5]

          lines = [
              "<b>📰 XO DAILY NEWS</b>",
              "<i>Le ultime notizie su The Weeknd</i>",
              ""
          ]

          for i, article in enumerate(articles, 1):
              title_it = translate(article["title"])
              summary_it = translate(article["description"][:700])

              lines.append(
                  f"<b>{i}. {html.escape(title_it)}</b>"
              )

              if summary_it and not similar(title_it, summary_it):
                  lines.append(html.escape(summary_it[:350]))

              if article["source"]:
                  source_text = html.escape(article["source"])
                  lines.append(f"<i>Fonte: {source_text}</i>")

              lines.append(
                  f'<a href="{html.escape(article["link"], quote=True)}">'
                  "Leggi la notizia</a>"
              )

              lines.append("")

          if not articles:
              lines.append(
                  "Nessuna nuova notizia pertinente nelle ultime 48 ore."
              )
              lines.append("")

          lines.extend([
              "📸 <b>INSTAGRAM</b>",
              '<a href="https://www.instagram.com/theweeknd/">'
              "Profilo ufficiale @theweeknd</a>",
              '<a href="https://www.instagram.com/abelspost/">'
              "Fanpage @abelspost</a>"
          ])

          message = "\n".join(lines)

          if len(message) > 4000:
              message = message[:3900]

          payload = urllib.parse.urlencode({
              "chat_id": os.environ["CHAT_ID"],
              "message_thread_id": os.environ["THREAD_ID"],
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": "false"
          }).encode()

          token = os.environ["BOT_TOKEN"]

          url = (
              f"https://api.telegram.org/bot{token}/sendMessage"
          )

          request = urllib.request.Request(
              url,
              data=payload,
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode())

          if not result.get("ok"):
              raise RuntimeError(
                  "Telegram non ha accettato il messaggio."
              )

          print(
              f"Pubblicazione completata: {len(articles)} notizie."
          )
          PY
