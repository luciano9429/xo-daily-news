name: XO Daily News

'on':
  schedule:
    - cron: '0 7,8 * * *'
  workflow_dispatch:

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Cerca e pubblica le notizie
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: '-1004476534522'
          THREAD_ID: '40'
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from email.utils import parsedate_to_datetime
          from html.parser import HTMLParser

          now = datetime.now(ZoneInfo("Europe/Rome"))
          if os.environ["EVENT_NAME"] == "schedule" and now.hour != 9:
              print("Non sono le 09:00 italiane: nessun invio.")
              raise SystemExit(0)

          class Extractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.images = []

              def handle_data(self, data):
                  self.parts.append(data)

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "img":
                      src = dict(attrs).get("src")
                      if src:
                          self.images.append(src)

          def clean(value):
              parser = Extractor()
              parser.feed(value or "")
              return re.sub(
                  r"\s+", " ", " ".join(parser.parts)
              ).strip()

          def translate(value):
              if not value:
                  return ""
              try:
                  params = urllib.parse.urlencode({
                      "client": "gtx",
                      "sl": "auto",
                      "tl": "it",
                      "dt": "t",
                      "q": value[:1000]
                  })
                  url = (
                      "https://translate.googleapis.com/"
                      "translate_a/single?" + params
                  )
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.loads(response.read().decode())
                  return "".join(
                      part[0] for part in data[0] if part[0]
                  )
              except Exception:
                  return value

          def get_image(item):
              for element in item.iter():
                  if (
                      element.tag.endswith("}thumbnail")
                      or element.tag.endswith("}content")
                  ):
                      url = element.attrib.get("url")
                      if url and url.startswith("http"):
                          return url

                  if element.tag == "enclosure":
                      url = element.attrib.get("url")
                      if url and url.startswith("http"):
                          return url

              description = item.findtext("description", "")
              parser = Extractor()
              parser.feed(description)

              for url in parser.images:
                  if url.startswith("http"):
                      return url

              return None

          query = '"The Weeknd" OR "Abel Tesfaye" when:2d'
          params = urllib.parse.urlencode({
              "q": query,
              "hl": "it",
              "gl": "IT",
              "ceid": "IT:it"
          })

          feed_url = (
              "https://news.google.com/rss/search?" + params
          )
          req = urllib.request.Request(
              feed_url, headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=25) as response:
              root = ET.fromstring(response.read())

          cutoff = datetime.now(timezone.utc) - timedelta(hours=48)
          articles = []
          seen = set()

          for item in root.findall(".//item"):
              title_raw = item.findtext("title", "")
              desc_raw = item.findtext("description", "")
              title = clean(title_raw)
              description = clean(desc_raw)
              link = item.findtext("link", "")
              pubdate = item.findtext("pubDate", "")

              searchable = (
                  title + " " + description
              ).casefold()

              if (
                  "the weeknd" not in searchable
                  and "abel tesfaye" not in searchable
              ):
                  continue

              if not title or not link:
                  continue

              try:
                  date = parsedate_to_datetime(pubdate)
                  if date.tzinfo is None:
                      date = date.replace(tzinfo=timezone.utc)
                  if date < cutoff:
                      continue
              except Exception:
                  continue

              key = title.casefold()
              if key in seen:
                  continue

              seen.add(key)

              articles.append({
                  "date": date,
                  "title": title,
                  "description": description,
                  "link": link,
                  "image": get_image(item)
              })

          articles.sort(
              key=lambda article: article["date"],
              reverse=True
          )
          articles = articles[:5]

          lines = [
              "📰 XO DAILY NEWS",
              "Le ultime notizie su The Weeknd",
              ""
          ]

          if articles:
              for i, article in enumerate(articles, 1):
                  title_it = translate(article["title"])
                  summary = translate(
                      article["description"][:500]
                  )

                  if not summary:
                      summary = "Apri la fonte per leggere la notizia."

                  lines.append(f"{i}. {title_it}")
                  lines.append(summary[:230])
                  lines.append(article["link"])
                  lines.append("")
          else:
              lines.extend([
                  "Nessuna nuova notizia pertinente nelle ultime 48 ore.",
                  ""
              ])

          lines.extend([
              "📸 INSTAGRAM",
              "Profilo ufficiale: https://www.instagram.com/theweeknd/",
              "Fanpage: https://www.instagram.com/abelspost/"
          ])

          message = "\n".join(lines).strip()

          token = os.environ["BOT_TOKEN"]
          base = f"https://api.telegram.org/bot{token}/"

          # Le foto vengono usate solo se disponibili nel feed.
          image = articles[0]["image"] if articles else None

          if image:
              payload = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "message_thread_id": os.environ["THREAD_ID"],
                  "photo": image,
                  "caption": message[:1000]
              }).encode()
              endpoint = base + "sendPhoto"
          else:
              payload = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "message_thread_id": os.environ["THREAD_ID"],
                  "text": message[:4000],
                  "disable_web_page_preview": "false"
              }).encode()
              endpoint = base + "sendMessage"

          request = urllib.request.Request(
              endpoint, data=payload
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              result = json.loads(response.read().decode())

          if not result.get("ok"):
              raise RuntimeError(
                  "Telegram non ha accettato il messaggio."
              )

          print(
              f"Pubblicazione completata. "
              f"Notizie trovate: {len(articles)}"
          )
          PY
