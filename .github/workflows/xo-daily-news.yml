
name: XO Daily News

'on':
  schedule:
    - cron: '0 7,8 * * *'
  workflow_dispatch:

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          python -m pip install requests feedparser beautifulsoup4 yt-dlp

      - name: Cerca e pubblica XO Daily News
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cat > daily.py <<'PY'
          import os
          import re
          import html
          import time
          import subprocess
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          import requests
          import feedparser
          from bs4 import BeautifulSoup

          CHAT_ID = "-1004476534522"
          TOPIC_ID = 40
          TZ = ZoneInfo("Europe/Rome")
          NOW = datetime.now(TZ)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; XODailyNews/1.0)"
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)

          # Feed RSS diretti
          RSS_FEEDS = {
              "Billboard": "https://www.billboard.com/feed/",
              "Billboard Music": "https://www.billboard.com/c/music/feed/",
              "Rolling Stone": "https://www.rollingstone.com/music/feed/",
              "Rolling Stone Music News": "https://www.rollingstone.com/music/music-news/feed/",
              "Pitchfork": "https://pitchfork.com/feed/rss",
              "Pitchfork News": "https://pitchfork.com/rss/news/",
          }

          CUTOFF = (
              datetime.now(timezone.utc)
              - timedelta(days=7)
          )

          def clean(value):
              return re.sub(
                  r"\s+",
                  " ",
                  html.unescape(str(value or ""))
              ).strip()

          def get(url, **kwargs):
              for attempt in range(3):
                  try:
                      response = SESSION.get(
                          url,
                          timeout=25,
                          allow_redirects=True,
                          **kwargs
                      )
                      response.raise_for_status()
                      return response
                  except Exception as e:
                      print(
                          f"Errore GET {url}, tentativo {attempt + 1}: {e}"
                      )
                      time.sleep(2)
              return None

          def translate(text):
              if not text:
                  return ""

              try:
                  response = get(
                      "https://translate.googleapis.com/translate_a/single",
                      params={
                          "client": "gtx",
                          "sl": "auto",
                          "tl": "it",
                          "dt": "t",
                          "q": text[:4000]
                      }
                  )

                  if response:
                      data = response.json()
                      return clean("".join(
                          part[0]
                          for part in data[0]
                          if part[0]
                      ))

              except Exception as e:
                  print("Traduzione non disponibile:", e)

              return text

          def entry_date(entry):
              for field in ("published_parsed", "updated_parsed"):
                  value = entry.get(field)

                  if value:
                      try:
                          from time import struct_time
                          return datetime(
                              *value[:6],
                              tzinfo=timezone.utc
                          )
                      except Exception:
                          pass

              return None

          def entry_description(entry):
              parts = []

              for field in ("summary", "description"):
                  value = entry.get(field, "")

                  if value:
                      parts.append(
                          BeautifulSoup(
                              value,
                              "html.parser"
                          ).get_text(" ", strip=True)
                      )

              for item in entry.get("content", []):
                  value = item.get("value", "")

                  if value:
                      parts.append(
                          BeautifulSoup(
                              value,
                              "html.parser"
                          ).get_text(" ", strip=True)
                      )

              # Elimina duplicati e descrizioni ripetute.
              unique = []
              for part in parts:
                  part = clean(part)
                  if part and part not in unique:
                      unique.append(part)

              return clean(" ".join(unique))

          def relevant(title, description):
              title = clean(title).lower()

              if (
                  "the weeknd" not in title
                  and "abel tesfaye" not in title
              ):
                  return False

              excluded = [
                  "stellar blade",
                  "shift up",
                  "playstation",
                  "xbox",
                  "nintendo",
                  "gaming",
                  "video game"
              ]

              if any(word in title for word in excluded):
                  return False

              return True

          def make_summary(description, title):
              text = clean(description)

              if len(text) < 100:
                  return ""

              generic = [
                  "google news",
                  "aggregated from sources",
                  "subscribe to our newsletter",
                  "sign up for our newsletter",
                  "read more",
                  "click here",
                  "cookie policy",
                  "privacy policy"
              ]

              if any(word in text.lower() for word in generic):
                  return ""

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              selected = []

              for sentence in sentences:
                  sentence = clean(sentence)

                  if len(sentence) < 35:
                      continue

                  if sentence.lower() == clean(title).lower():
                      continue

                  if any(word in sentence.lower() for word in [
                      "cookie policy",
                      "privacy policy",
                      "terms of service",
                      "advertisement",
                      "subscribe now"
                  ]):
                      continue

                  selected.append(sentence)

                  if len(" ".join(selected)) >= 700:
                      break

              if not selected:
                  return ""

              summary = translate(
                  " ".join(selected)[:3000]
              )

              if len(summary) < 80:
                  return ""

              if len(summary) > 650:
                  summary = (
                      summary[:650].rsplit(" ", 1)[0] + "…"
                  )

              return summary

          def get_news():
              found = {}

              for source, feed_url in RSS_FEEDS.items():
                  print("Controllo:", source)

                  response = get(feed_url)

                  if not response:
                      print("Feed non raggiungibile:", source)
                      continue

                  feed = feedparser.parse(response.content)

                  print(
                      source,
                      "- articoli:",
                      len(feed.entries),
                      "- errore:",
                      feed.bozo
                  )

                  for entry in feed.entries:
                      title = clean(entry.get("title", ""))
                      link = entry.get("link", "")

                      if not title or not link:
                          continue

                      description = entry_description(entry)

                      if not relevant(title, description):
                          continue

                      date = entry_date(entry)

                      if date and date < CUTOFF:
                          continue

                      key = re.sub(
                          r"[^a-z0-9]",
                          "",
                          title.lower()
                      )

                      if key not in found:
                          found[key] = {
                              "title": title,
                              "link": link,
                              "source": source,
                              "description": description,
                              "date": date
                          }

                      elif len(description) > len(
                          found[key]["description"]
                      ):
                          found[key]["description"] = description

              articles = list(found.values())

              articles.sort(
                  key=lambda x: x["date"] or datetime.min.replace(
                      tzinfo=timezone.utc
                  ),
                  reverse=True
              )

              results = []

              for article in articles[:5]:
                  article["summary"] = make_summary(
                      article["description"],
                      article["title"]
                  )
                  results.append(article)

              return results

          def get_youtube():
              queries = [
                  "The Weeknd interview",
                  "The Weeknd live performance",
                  "The Weeknd music video",
                  "Abel Tesfaye interview"
              ]

              videos = {}
              cutoff = (
                  datetime.now(timezone.utc)
                  - timedelta(days=7)
              )

              for query in queries:
                  print("Ricerca YouTube:", query)

                  try:
                      command = [
                          "yt-dlp",
                          "--dump-single-json",
                          "--no-warnings",
                          "--ignore-errors",
                          "--skip-download",
                          "--playlist-end", "10",
                          "--socket-timeout", "20",
                          "ytsearch10:" + query
                      ]

                      process = subprocess.run(
                          command,
                          capture_output=True,
                          text=True,
                          timeout=100
                      )

                      if process.returncode != 0:
                          print(
                              "Avviso yt-dlp:",
                              process.stderr[-500:]
                          )

                      if not process.stdout.strip():
                          continue

                      import json
                      data = json.loads(process.stdout)

                      entries = data.get("entries", [])

                      for video in entries:
                          if not video:
                              continue

                          title = clean(video.get("title", ""))
                          channel = clean(
                              video.get("channel", "")
                              or video.get("uploader", "")
                          )

                          video_id = video.get("id", "")

                          if not video_id:
                              continue

                          combined = (
                              title + " " + channel
                          ).lower()

                          if not any(term in combined for term in [
                              "weeknd",
                              "abel tesfaye",
                              "xo"
                          ]):
                              continue

                          upload_date = video.get("upload_date")

                          if upload_date:
                              try:
                                  date = datetime.strptime(
                                      upload_date,
                                      "%Y%m%d"
                                  ).replace(
                                      tzinfo=timezone.utc
                                  )

                                  if date < cutoff:
                                      continue

                              except Exception:
                                  pass

                          videos[video_id] = {
                              "title": title,
                              "channel": channel,
                              "url": (
                                  "https://www.youtube.com/watch?v="
                                  + video_id
                              )
                          }

                  except subprocess.TimeoutExpired:
                      print("Ricerca YouTube scaduta:", query)

                  except Exception as e:
                      print("Errore YouTube:", e)

                  time.sleep(2)

              return list(videos.values())[:8]

          def esc(text):
              return html.escape(str(text), quote=False)

          def build_message(articles, videos):
              lines = [
                  "📰 <b>XO DAILY NEWS</b>",
                  "Le ultime notizie su The Weeknd",
                  ""
              ]

              if articles:
                  for i, article in enumerate(articles, 1):
                      lines.append(
                          f"<b>{i}. {esc(article['title'])}</b>"
                      )

                      lines.append(
                          "Fonte: " + esc(article["source"])
                      )

                      if article["summary"]:
                          lines.append(
                              esc(article["summary"])
                          )

                      lines.append(
                          '<a href="'
                          + html.escape(
                              article["link"],
                              quote=True
                          )
                          + '">Leggi la notizia</a>'
                      )

                      lines.append("")

              else:
                  lines.extend([
                      "Nessuna nuova notizia pertinente trovata nei feed RSS negli ultimi 7 giorni.",
                      ""
                  ])

              lines.extend([
                  "🎬 <b>NUOVI VIDEO YOUTUBE</b>",
                  ""
              ])

              if videos:
                  for video in videos:
                      lines.append(
                          '• <a href="'
                          + html.escape(
                              video["url"],
                              quote=True
                          )
                          + '">'
                          + esc(video["title"])
                          + '</a>'
                      )

                      if video["channel"]:
                          lines.append(
                              "Canale: " + esc(video["channel"])
                          )

              else:
                  lines.append(
                      "Nessun video pertinente recuperato dalla ricerca YouTube."
                  )

              lines.extend([
                  "",
                  "📸 <b>INSTAGRAM</b>",
                  '<a href="https://www.instagram.com/theweeknd/">Profilo ufficiale @theweeknd</a>',
                  '<a href="https://www.instagram.com/abelspost/">Fanpage @abelspost</a>'
              ])

              return "\n".join(lines)

          def send_telegram(message):
              url = (
                  "https://api.telegram.org/bot"
                  + os.environ["BOT_TOKEN"]
                  + "/sendMessage"
              )

              payload = {
                  "chat_id": CHAT_ID,
                  "message_thread_id": TOPIC_ID,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }

              for attempt in range(3):
                  try:
                      response = requests.post(
                          url,
                          data=payload,
                          timeout=30
                      )

                      print(
                          "Risposta Telegram:",
                          response.status_code,
                          response.text[:500]
                      )

                      response.raise_for_status()

                      if not response.json().get("ok"):
                          raise RuntimeError(response.text)

                      return

                  except Exception as e:
                      print(
                          "Errore invio Telegram:",
                          attempt + 1,
                          e
                      )
                      time.sleep(3)

              raise RuntimeError(
                  "Impossibile pubblicare su Telegram."
              )

          # Il cron gira alle 08:00 UTC in inverno
          # e alle 07:00 UTC in estate: entrambi corrispondono
          # alle 09:00 in Italia. Il secondo controllo evita
          # il doppio invio.
          if (
              os.getenv("GITHUB_EVENT_NAME") == "schedule"
              and NOW.hour != 9
          ):
              print("Esecuzione non prevista: salto.")
              raise SystemExit(0)

          print("Avvio ricerca notizie...")
          articles = get_news()
          print("Notizie trovate:", len(articles))

          print("Avvio ricerca YouTube...")
          videos = get_youtube()
          print("Video trovati:", len(videos))

          message = build_message(
              articles,
              videos
          )

          send_telegram(message)

          print("XO Daily News pubblicato.")
          PY

          python daily.py
