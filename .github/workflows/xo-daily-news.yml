
name: XO Daily News

'on':
  schedule:
    - cron: '0 7,8 * * *'
  workflow_dispatch:

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Cerca notizie e nuovi video
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import html
          import json
          import time
          import urllib.request
          import urllib.parse
          import urllib.error
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from difflib import SequenceMatcher
          from email.utils import parsedate_to_datetime

          TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = "-1004476534522"
          THREAD_ID = "40"

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; XODailyNews/1.0)"
          }

          # Connessioni con tre tentativi e attese progressive.
          def request_retry(url, data=None, timeout=20):
              last_error = None

              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          data=data,
                          headers=HEADERS,
                          method="POST" if data else "GET"
                      )

                      with urllib.request.urlopen(
                          req, timeout=timeout
                      ) as response:
                          return response.read().decode(
                              response.headers.get_content_charset() or "utf-8",
                              errors="replace"
                          )

                  except Exception as e:
                      last_error = e
                      print(
                          f"Tentativo {attempt}/3 fallito per "
                          f"{url[:120]}: {type(e).__name__}: {e}",
                          flush=True
                      )

                      if attempt < 3:
                          time.sleep(attempt * 3)

              raise last_error

          def fetch(url, timeout=20):
              return request_retry(url, timeout=timeout)

          def clean(value):
              value = html.unescape(
                  re.sub(r"<[^>]+>", " ", value or "")
              )
              return re.sub(r"\s+", " ", value).strip()

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          def parse_date(value):
              if not value:
                  return None
              try:
                  return parsedate_to_datetime(value).astimezone(
                      timezone.utc
                  )
              except Exception:
                  try:
                      return datetime.fromisoformat(
                          value.replace("Z", "+00:00")
                      ).astimezone(timezone.utc)
                  except Exception:
                      return None

          # Controllo orario solo per le esecuzioni automatiche.
          now = datetime.now(ZoneInfo("Europe/Rome"))

          if (
              os.environ.get("GITHUB_EVENT_NAME") == "schedule"
              and now.hour != 9
          ):
              print("Non sono le 09:00 in Italia: salto l'esecuzione.")
              raise SystemExit(0)

          cutoff_news = datetime.now(timezone.utc) - timedelta(hours=48)
          cutoff_video = datetime.now(timezone.utc) - timedelta(hours=24)

          # -------------------------------------------------
          # TRADUZIONE
          # -------------------------------------------------

          def translate(text):
              if not text:
                  return ""

              try:
                  url = (
                      "https://translate.googleapis.com/translate_a/single?"
                      + urllib.parse.urlencode({
                          "client": "gtx",
                          "sl": "auto",
                          "tl": "it",
                          "dt": "t",
                          "q": text[:1500]
                      })
                  )

                  result = json.loads(fetch(url, timeout=15))
                  return "".join(
                      part[0] for part in result[0] if part[0]
                  )

              except Exception as e:
                  print(
                      "Traduzione non disponibile:",
                      type(e).__name__, str(e)[:150]
                  )
                  return text

          # -------------------------------------------------
          # ESTRAZIONE DESCRIZIONI ARTICOLI
          # -------------------------------------------------

          class ArticleParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
                  self.paragraphs = []
                  self.current = ""
                  self.in_paragraph = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag == "meta":
                      key = (
                          attrs.get("property")
                          or attrs.get("name")
                          or ""
                      ).lower()

                      value = attrs.get("content", "").strip()

                      if key and value:
                          self.meta[key] = value

                  elif tag == "p":
                      self.in_paragraph = True
                      self.current = ""

              def handle_data(self, data):
                  if self.in_paragraph:
                      self.current += data + " "

              def handle_endtag(self, tag):
                  if tag == "p" and self.in_paragraph:
                      paragraph = clean(self.current)

                      if len(paragraph) > 70:
                          self.paragraphs.append(paragraph)

                      self.in_paragraph = False
                      self.current = ""

          def get_summary(url, title):
              try:
                  page = fetch(url, timeout=20)

                  parser = ArticleParser()
                  parser.feed(page[:1000000])

                  description = (
                      parser.meta.get("og:description")
                      or parser.meta.get("twitter:description")
                      or parser.meta.get("description")
                      or ""
                  )

                  description = clean(description)

                  if (
                      not description
                      or SequenceMatcher(
                          None,
                          description.lower(),
                          title.lower()
                      ).ratio() > 0.72
                  ):
                      candidates = [
                          p for p in parser.paragraphs
                          if len(p) > 90
                          and SequenceMatcher(
                              None, p.lower(), title.lower()
                          ).ratio() < 0.72
                      ]

                      description = (
                          candidates[0] if candidates else ""
                      )

                  if not description:
                      return ""

                  description = clean(translate(description))

                  if len(description) > 360:
                      description = (
                          description[:357].rsplit(" ", 1)[0] + "..."
                      )

                  return description

              except Exception as e:
                  print(
                      f"Descrizione non recuperata da {url[:100]}:",
                      type(e).__name__, str(e)[:150]
                  )
                  return ""

          # -------------------------------------------------
          # GOOGLE NEWS
          # -------------------------------------------------

          news = []
          seen = set()

          query = '"The Weeknd" OR "Abel Tesfaye" when:2d'

          news_url = (
              "https://news.google.com/rss/search?"
              + urllib.parse.urlencode({
                  "q": query,
                  "hl": "it",
                  "gl": "IT",
                  "ceid": "IT:it"
              })
          )

          try:
              feed = fetch(news_url)
              root = ET.fromstring(feed)

              for item in root.findall(".//item"):
                  title = clean(item.findtext("title", ""))
                  link = item.findtext("link", "").strip()
                  description = clean(
                      item.findtext("description", "")
                  )

                  source_el = item.find("source")
                  source = clean(
                      source_el.text if source_el is not None else ""
                  )

                  if not title or not link:
                      continue

                  searchable = (title + " " + description).lower()

                  if (
                      "the weeknd" not in searchable
                      and "abel tesfaye" not in searchable
                  ):
                      continue

                  published = parse_date(
                      item.findtext("pubDate", "")
                  )

                  if published and published < cutoff_news:
                      continue

                  key = re.sub(
                      r"[^a-z0-9]", "", title.lower()
                  )

                  if key in seen:
                      continue

                  seen.add(key)

                  if source:
                      title = re.sub(
                          r"\s*[-|–]\s*" + re.escape(source) + r"\s*$",
                          "",
                          title,
                          flags=re.IGNORECASE
                      )

                  news.append({
                      "title": title,
                      "link": link,
                      "source": source or "Fonte originale"
                  })

                  if len(news) >= 5:
                      break

              print(
                  f"Google News: recuperate {len(news)} notizie."
              )

          except Exception as e:
              print(
                  "FEED GOOGLE NEWS NON DISPONIBILE:",
                  type(e).__name__, str(e)[:200]
              )

          # -------------------------------------------------
          # VIDEO YOUTUBE UFFICIALI
          # -------------------------------------------------

          videos = []

          youtube_url = (
              "https://www.youtube.com/feeds/videos.xml"
              "?channel_id=UC0WP5P-ufpRfjbNrmOWwLBQ"
          )

          try:
              feed = fetch(youtube_url)
              root = ET.fromstring(feed)

              ns = {
                  "atom": "http://www.w3.org/2005/Atom"
              }

              for entry in root.findall("atom:entry", ns):
                  title = clean(
                      entry.findtext("atom:title", "", ns)
                  )

                  link_el = entry.find("atom:link", ns)

                  link = (
                      link_el.attrib.get("href", "")
                      if link_el is not None else ""
                  )

                  published = parse_date(
                      entry.findtext("atom:published", "", ns)
                  )

                  if not title or not link:
                      continue

                  if published and published < cutoff_video:
                      continue

                  videos.append({
                      "title": title,
                      "link": link
                  })

                  if len(videos) >= 5:
                      break

              print(
                  f"YouTube: recuperati {len(videos)} video."
              )

          except Exception as e:
              print(
                  "FEED YOUTUBE NON DISPONIBILE:",
                  type(e).__name__, str(e)[:200]
              )

          # -------------------------------------------------
          # CREAZIONE MESSAGGIO
          # -------------------------------------------------

          lines = [
              "<b>📰 XO DAILY NEWS</b>",
              "<i>Le ultime notizie su The Weeknd</i>",
              ""
          ]

          if news:
              for index, article in enumerate(news, 1):
                  summary = get_summary(
                      article["link"], article["title"]
                  )

                  lines.append(
                      f"<b>{index}. {esc(article['title'])}</b>"
                  )

                  lines.append(
                      f"<i>Fonte: {esc(article['source'])}</i>"
                  )

                  if summary:
                      lines.append(esc(summary))
                  else:
                      lines.append(
                          "<i>Apri la fonte per leggere i dettagli.</i>"
                      )

                  lines.append(
                      f'<a href="{esc(article["link"])}">'
                      "Leggi la notizia</a>"
                  )
                  lines.append("")

          else:
              lines.append(
                  "Nessuna nuova notizia trovata."
              )
              lines.append("")

          lines.append("<b>🎬 NUOVI VIDEO YOUTUBE</b>")
          lines.append("")

          if videos:
              for video in videos:
                  lines.append(
                      f"<b>{esc(video['title'])}</b>"
                  )
                  lines.append(
                      f'<a href="{esc(video["link"])}">'
                      "Guarda il video</a>"
                  )
                  lines.append("")
          else:
              lines.append(
                  "Nessun nuovo video nelle ultime 24 ore."
              )
              lines.append("")

          lines.extend([
              "📸 <b>INSTAGRAM</b>",
              '<a href="https://www.instagram.com/theweeknd/">'
              "Profilo ufficiale @theweeknd</a>",
              '<a href="https://www.instagram.com/abelspost/">'
              "Fanpage @abelspost</a>"
          ])

          message = "\n".join(lines)

          if len(message) > 3800:
              message = (
                  message[:3750]
                  + "\n\n<i>Consulta i link per gli altri contenuti.</i>"
              )

          # -------------------------------------------------
          # INVIO TELEGRAM CON TRE TENTATIVI
          # -------------------------------------------------

          api_url = (
              f"https://api.telegram.org/bot{TOKEN}/sendMessage"
          )

          payload = urllib.parse.urlencode({
              "chat_id": CHAT_ID,
              "message_thread_id": THREAD_ID,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": "false"
          }).encode()

          print("Invio del messaggio a Telegram...")

          try:
              response_text = request_retry(
                  api_url,
                  data=payload,
                  timeout=30
              )

              result = json.loads(response_text)

              if not result.get("ok"):
                  raise RuntimeError(
                      "Telegram ha restituito: " + str(result)
                  )

              print(
                  "PUBBLICAZIONE RIUSCITA. "
                  f"Notizie: {len(news)}. Video: {len(videos)}."
              )

          except Exception as e:
              print(
                  "ERRORE FINALE INVIO TELEGRAM:",
                  type(e).__name__, str(e)
              )
              raise

          PY
