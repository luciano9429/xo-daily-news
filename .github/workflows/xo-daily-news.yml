
name: XO Daily News

'on':
  schedule:
    - cron: '0 7,8 * * *'
  workflow_dispatch:

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Installa strumento di ricerca YouTube
        run: python -m pip install yt-dlp

      - name: Cerca notizie e nuovi video
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import html
          import json
          import time
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import subprocess
          from html.parser import HTMLParser
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from difflib import SequenceMatcher
          from email.utils import parsedate_to_datetime

          TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = "-1004476534522"
          THREAD_ID = "40"

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; XODailyNews/1.0)"
          }

          def request_retry(url, data=None, timeout=20):
              last_error = None

              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          data=data,
                          headers=HEADERS,
                          method="POST" if data else "GET"
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return response.read().decode(
                              response.headers.get_content_charset() or "utf-8",
                              errors="replace"
                          )
                  except Exception as e:
                      last_error = e
                      print(
                          f"Tentativo {attempt}/3 per {url[:100]}: "
                          f"{type(e).__name__}: {e}",
                          flush=True
                      )
                      if attempt < 3:
                          time.sleep(attempt * 3)

              raise last_error

          def fetch(url, timeout=20):
              return request_retry(url, timeout=timeout)

          def clean(value):
              value = html.unescape(re.sub(r"<[^>]+>", " ", value or ""))
              return re.sub(r"\s+", " ", value).strip()

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          def parse_date(value):
              if not value:
                  return None
              try:
                  return parsedate_to_datetime(value).astimezone(timezone.utc)
              except Exception:
                  try:
                      return datetime.fromisoformat(
                          value.replace("Z", "+00:00")
                      ).astimezone(timezone.utc)
                  except Exception:
                      return None

          now = datetime.now(ZoneInfo("Europe/Rome"))

          if (
              os.environ.get("GITHUB_EVENT_NAME") == "schedule"
              and now.hour != 9
          ):
              print("Non sono le 09:00 in Italia: salto l'esecuzione.")
              raise SystemExit(0)

          cutoff_news = datetime.now(timezone.utc) - timedelta(hours=48)
          cutoff_video = datetime.now(timezone.utc) - timedelta(hours=24)

          # -------------------------------------------------
          # TRADUZIONE
          # -------------------------------------------------

          def translate(text):
              if not text:
                  return ""
              try:
                  url = (
                      "https://translate.googleapis.com/translate_a/single?"
                      + urllib.parse.urlencode({
                          "client": "gtx",
                          "sl": "auto",
                          "tl": "it",
                          "dt": "t",
                          "q": text[:1500]
                      })
                  )
                  result = json.loads(fetch(url, timeout=15))
                  return "".join(
                      part[0] for part in result[0] if part[0]
                  )
              except Exception as e:
                  print("Traduzione non disponibile:", str(e)[:150])
                  return text

          # -------------------------------------------------
          # ESTRAZIONE DESCRIZIONI ARTICOLI
          # -------------------------------------------------

          class ArticleParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
                  self.paragraphs = []
                  self.current = ""
                  self.in_paragraph = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "meta":
                      key = (
                          attrs.get("property")
                          or attrs.get("name")
                          or ""
                      ).lower()
                      value = attrs.get("content", "").strip()
                      if key and value:
                          self.meta[key] = value
                  elif tag == "p":
                      self.in_paragraph = True
                      self.current = ""

              def handle_data(self, data):
                  if self.in_paragraph:
                      self.current += data + " "

              def handle_endtag(self, tag):
                  if tag == "p" and self.in_paragraph:
                      paragraph = clean(self.current)
                      if len(paragraph) > 70:
                          self.paragraphs.append(paragraph)
                      self.in_paragraph = False
                      self.current = ""

          def useful_description(text, title):
              text = clean(text)
              if len(text) < 80:
                  return False

              lower = text.lower()
              generic_phrases = [
                  "google news",
                  "aggregata da fonti di tutto il mondo",
                  "copertura di notizie aggiornata e completa",
                  "comprehensive up-to-date news coverage",
                  "comprehensive news coverage",
                  "news from around the world"
              ]

              if any(phrase in lower for phrase in generic_phrases):
                  return False

              if SequenceMatcher(
                  None, text.lower(), title.lower()
              ).ratio() > 0.88:
                  return False

              return True

          def get_summary(url, title):
              try:
                  page = fetch(url, timeout=20)
                  parser = ArticleParser()
                  parser.feed(page[:1000000])

                  candidates = [
                      parser.meta.get("og:description", ""),
                      parser.meta.get("twitter:description", ""),
                      parser.meta.get("description", "")
                  ]

                  candidates.extend(parser.paragraphs)

                  description = next(
                      (
                          clean(candidate)
                          for candidate in candidates
                          if useful_description(candidate, title)
                      ),
                      ""
                  )

                  if not description:
                      return ""

                  description = clean(translate(description))

                  if len(description) > 360:
                      description = (
                          description[:357].rsplit(" ", 1)[0] + "..."
                      )

                  return description

              except Exception as e:
                  print(
                      f"Descrizione non recuperata: {type(e).__name__}: {e}"
                  )
                  return ""

          # -------------------------------------------------
          # GOOGLE NEWS
          # -------------------------------------------------

          news = []
          seen_news = set()

          query = '"The Weeknd" OR "Abel Tesfaye" when:2d'
          news_url = (
              "https://news.google.com/rss/search?"
              + urllib.parse.urlencode({
                  "q": query,
                  "hl": "it",
                  "gl": "IT",
                  "ceid": "IT:it"
              })
          )

          try:
              feed = fetch(news_url)
              root = ET.fromstring(feed)

              for item in root.findall(".//item"):
                  title = clean(item.findtext("title", ""))
                  link = item.findtext("link", "").strip()
                  description = clean(item.findtext("description", ""))
                  source_el = item.find("source")
                  source = clean(
                      source_el.text if source_el is not None else ""
                  )

                  if not title or not link:
                      continue

                  searchable = (title + " " + description).lower()
                  if (
                      "the weeknd" not in searchable
                      and "abel tesfaye" not in searchable
                  ):
                      continue

                  published = parse_date(item.findtext("pubDate", ""))
                  if published and published < cutoff_news:
                      continue

                  key = re.sub(r"[^a-z0-9]", "", title.lower())
                  if key in seen_news:
                      continue
                  seen_news.add(key)

                  if source:
                      title = re.sub(
                          r"\s*[-|–]\s*" + re.escape(source) + r"\s*$",
                          "",
                          title,
                          flags=re.IGNORECASE
                      )

                  news.append({
                      "title": title,
                      "link": link,
                      "source": source or "Fonte originale"
                  })

                  if len(news) >= 5:
                      break

              print(f"Google News: {len(news)} notizie.")

          except Exception as e:
              print(
                  "FEED GOOGLE NEWS NON DISPONIBILE:",
                  type(e).__name__, str(e)[:200]
              )

          # -------------------------------------------------
          # YOUTUBE: CANALE UFFICIALE + ALTRI CANALI
          # -------------------------------------------------

          videos = []
          seen_videos = set()

          def add_video(title, url, channel, upload_date=None):
              title = clean(title)
              if not title or not url:
                  return

              if upload_date:
                  try:
                      published = datetime.strptime(
                          upload_date, "%Y%m%d"
                      ).replace(tzinfo=timezone.utc)
                      if published < cutoff_video:
                          return
                  except Exception:
                      return
              else:
                  # Senza data verificabile non rischiamo
                  # di ripubblicare vecchi video.
                  return

              searchable = (title + " " + channel).lower()

              if not any(term in searchable for term in [
                  "weeknd", "abel tesfaye", "xo"
              ]):
                  return

              key = url.split("?")[0].rstrip("/")
              if key in seen_videos:
                  return

              seen_videos.add(key)

              videos.append({
                  "title": title,
                  "link": url,
                  "channel": channel or "YouTube"
              })

          # Feed ufficiale: controllo aggiuntivo.
          try:
              official_url = (
                  "https://www.youtube.com/feeds/videos.xml"
                  "?channel_id=UC0WP5P-ufpRfjbNrmOWwLBQ"
              )
              feed = fetch(official_url)
              root = ET.fromstring(feed)

              ns = {
                  "atom": "http://www.w3.org/2005/Atom"
              }

              for entry in root.findall("atom:entry", ns):
                  title = entry.findtext("atom:title", "", ns)
                  link_el = entry.find("atom:link", ns)
                  link = (
                      link_el.attrib.get("href", "")
                      if link_el is not None else ""
                  )
                  published = parse_date(
                      entry.findtext("atom:published", "", ns)
                  )

                  upload_date = (
                      published.strftime("%Y%m%d") if published else None
                  )

                  add_video(
                      title, link, "The Weeknd Official", upload_date
                  )

          except Exception as e:
              print("Feed ufficiale YouTube non disponibile:", str(e)[:150])

          # Ricerche su altri canali.
          searches = [
              "The Weeknd interview",
              "The Weeknd live performance",
              "The Weeknd music video",
              "Abel Tesfaye interview"
          ]

          for search in searches:
              if len(videos) >= 8:
                  break

              try:
                  command = [
                      "yt-dlp",
                      "--flat-playlist",
                      "--dump-single-json",
                      "--no-warnings",
                      "--ignore-errors",
                      "--playlist-end", "8",
                      "ytsearch8:" + search
                  ]

                  result = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=90
                  )

                  if result.returncode != 0 and not result.stdout.strip():
                      print(
                          "Ricerca YouTube non riuscita:",
                          search,
                          result.stderr[-300:]
                      )
                      continue

                  data = json.loads(result.stdout)
                  entries = data.get("entries", [])

                  for entry in entries:
                      if not entry:
                          continue

                      video_id = entry.get("id")
                      url = entry.get("webpage_url")

                      if not url and video_id:
                          url = "https://www.youtube.com/watch?v=" + video_id

                      add_video(
                          entry.get("title", ""),
                          url,
                          entry.get("channel") or entry.get("uploader", ""),
                          entry.get("upload_date")
                      )

              except Exception as e:
                  print(
                      f"Ricerca YouTube '{search}' non disponibile:",
                      type(e).__name__, str(e)[:150]
                  )

          videos = videos[:8]
          print(f"YouTube: {len(videos)} video recenti pertinenti.")

          # -------------------------------------------------
          # CREAZIONE MESSAGGIO
          # -------------------------------------------------

          lines = [
              "<b>📰 XO DAILY NEWS</b>",
              "<i>Le ultime notizie su The Weeknd</i>",
              ""
          ]

          if news:
              for index, article in enumerate(news, 1):
                  summary = get_summary(
                      article["link"], article["title"]
                  )

                  lines.append(
                      f"<b>{index}. {esc(article['title'])}</b>"
                  )
                  lines.append(
                      f"<i>Fonte: {esc(article['source'])}</i>"
                  )

                  if summary:
                      lines.append(esc(summary))

                  lines.append(
                      f'<a href="{esc(article["link"])}">Leggi la notizia</a>'
                  )
                  lines.append("")
          else:
              lines.extend([
                  "Nessuna nuova notizia trovata.",
                  ""
              ])

          lines.append("<b>🎬 NUOVI VIDEO YOUTUBE</b>")
          lines.append("")

          if videos:
              for video in videos:
                  lines.append(f"<b>{esc(video['title'])}</b>")
                  lines.append(
                      f"<i>Canale: {esc(video['channel'])}</i>"
                  )
                  lines.append(
                      f'<a href="{esc(video["link"])}">Guarda il video</a>'
                  )
                  lines.append("")
          else:
              lines.extend([
                  "Nessun nuovo video pertinente nelle ultime 24 ore.",
                  ""
              ])

          lines.extend([
              "📸 <b>INSTAGRAM</b>",
              '<a href="https://www.instagram.com/theweeknd/">Profilo ufficiale @theweeknd</a>',
              '<a href="https://www.instagram.com/abelspost/">Fanpage @abelspost</a>'
          ])

          message = "\n".join(lines)

          if len(message) > 3800:
              message = (
                  message[:3750]
                  + "\n\n<i>Consulta i link per gli altri contenuti.</i>"
              )

          # -------------------------------------------------
          # INVIO TELEGRAM
          # -------------------------------------------------

          api_url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

          payload = urllib.parse.urlencode({
              "chat_id": CHAT_ID,
              "message_thread_id": THREAD_ID,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": "false"
          }).encode()

          print("Invio del messaggio a Telegram...")

          try:
              response_text = request_retry(
                  api_url,
                  data=payload,
                  timeout=30
              )

              result = json.loads(response_text)

              if not result.get("ok"):
                  raise RuntimeError(
                      "Telegram ha restituito: " + str(result)
                  )

              print(
                  f"PUBBLICAZIONE RIUSCITA: "
                  f"{len(news)} notizie e {len(videos)} video."
              )

          except Exception as e:
              print(
                  "ERRORE INVIO TELEGRAM:",
                  type(e).__name__, str(e)
              )
              raise

          PY
