name: XO Daily News

'on':
  schedule:
    - cron: '15 9 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xo-daily-news
  cancel-in-progress: false

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ripristina memoria pubblicazioni
        uses: actions/cache@v4
        with:
          path: .xo_state
          key: xo-seen-${{ github.run_id }}
          restore-keys: |
            xo-seen-

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 yt-dlp

      - name: Pubblica XO Daily News
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python <<'PY'
          import os
          import re
          import json
          import html
          import hashlib
          import logging
          from datetime import datetime, timedelta, timezone
          from urllib.parse import urlsplit, urlunsplit, parse_qs
          from pathlib import Path

          import requests
          import feedparser
          from bs4 import BeautifulSoup
          import yt_dlp

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s %(levelname)s %(message)s"
          )

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = "-1004476534522"
          THREAD_ID = 40

          STATE_DIR = Path(".xo_state")
          STATE_FILE = STATE_DIR / "seen.json"
          STATE_DIR.mkdir(exist_ok=True)

          NOW = datetime.now(timezone.utc)
          NEWS_CUTOFF = NOW - timedelta(hours=24)
          VIDEO_CUTOFF = NOW - timedelta(days=7)
          FIRST_RUN = not STATE_FILE.exists()

          SESSION = requests.Session()
          SESSION.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; XODailyNews/1.0)"
          })

          RSS_FEEDS = [
              "https://pitchfork.com/feed/feed-news/rss",
              "https://www.billboard.com/feed/",
              "https://www.rollingstone.com/music/music-news/feed/",
          ]

          OFFICIAL_YOUTUBE_RSS = (
              "https://www.youtube.com/feeds/videos.xml"
              "?channel_id=UC0WP5P-ufpRfjbNrmOWwLBQ"
          )

          INSTAGRAM_LINKS = [
              ("The Weeknd", "https://www.instagram.com/theweeknd/"),
              ("Abel's Post", "https://www.instagram.com/abelspost/"),
          ]

          def load_state():
              if not STATE_FILE.exists():
                  return {"news": {}, "videos": {}}
              try:
                  data = json.loads(STATE_FILE.read_text(encoding="utf-8"))
                  return {
                      "news": data.get("news", {}),
                      "videos": data.get("videos", {})
                  }
              except Exception as exc:
                  logging.warning("Memoria non leggibile: %s", exc)
                  return {"news": {}, "videos": {}}

          state = load_state()

          def save_state():
              cutoff = NOW - timedelta(days=30)
              for category in ("news", "videos"):
                  cleaned = {}
                  for key, value in state[category].items():
                      try:
                          timestamp = datetime.fromisoformat(value)
                          if timestamp.tzinfo is None:
                              timestamp = timestamp.replace(tzinfo=timezone.utc)
                          if timestamp >= cutoff:
                              cleaned[key] = value
                      except Exception:
                          continue
                  state[category] = cleaned

              STATE_FILE.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

          def parse_date(value):
              if not value:
                  return None
              try:
                  dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass
              try:
                  from email.utils import parsedate_to_datetime
                  dt = parsedate_to_datetime(value)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def normalize_url(url):
              if not url:
                  return ""
              parts = urlsplit(url.strip())
              return urlunsplit((
                  parts.scheme.lower(),
                  parts.netloc.lower(),
                  parts.path.rstrip("/"),
                  "",
                  ""
              ))

          def is_relevant(text):
              value = (text or "").lower()
              return (
                  "the weeknd" in value
                  or "abel tesfaye" in value
              )

          def article_text(url):
              try:
                  response = SESSION.get(url, timeout=15)
                  response.raise_for_status()
                  soup = BeautifulSoup(response.text, "html.parser")

                  for script in soup.find_all(
                      "script", type="application/ld+json"
                  ):
                      try:
                          data = json.loads(script.string or script.get_text())
                          objects = data if isinstance(data, list) else [data]
                          for obj in objects:
                              if isinstance(obj, dict):
                                  body = obj.get("articleBody")
                                  if body and len(body) > 150:
                                      return body
                      except Exception:
                          continue

                  paragraphs = [
                      p.get_text(" ", strip=True)
                      for p in soup.find_all("p")
                  ]
                  text = " ".join(p for p in paragraphs if len(p) > 35)
                  if len(text) > 150:
                      return text

                  description = soup.find(
                      "meta", attrs={"name": "description"}
                  )
                  if description:
                      return description.get("content", "")
              except Exception as exc:
                  logging.warning("Lettura articolo fallita: %s", exc)
              return ""

          def translate_google(text):
              try:
                  response = SESSION.get(
                      "https://translate.googleapis.com/translate_a/single",
                      params={
                          "client": "gtx",
                          "sl": "en",
                          "tl": "it",
                          "dt": "t",
                          "q": text[:4500]
                      },
                      timeout=15
                  )
                  response.raise_for_status()
                  data = response.json()
                  return "".join(
                      part[0] for part in data[0] if part and part[0]
                  ).strip()
              except Exception as exc:
                  logging.warning("Traduzione Google non riuscita: %s", exc)
                  return ""

          def translate_mymemory(text):
              try:
                  response = SESSION.get(
                      "https://api.mymemory.translated.net/get",
                      params={
                          "q": text[:450],
                          "langpair": "en|it"
                      },
                      timeout=15
                  )
                  response.raise_for_status()
                  translated = response.json().get(
                      "responseData", {}
                  ).get("translatedText", "")
                  return html.unescape(translated).strip()
              except Exception as exc:
                  logging.warning("Traduzione alternativa fallita: %s", exc)
                  return ""

          def summarize(text):
              if not text:
                  return "Testo dell'articolo non disponibile."

              text = re.sub(r"\s+", " ", text).strip()
              sentences = re.split(r"(?<=[.!?])\s+", text)
              summary = " ".join(sentences[:4]).strip()

              translated = translate_google(summary)
              if not translated:
                  translated = translate_mymemory(summary)

              if translated:
                  return translated

              return "Traduzione non disponibile."

          def collect_news():
              found = []
              seen_this_run = set()

              for feed_url in RSS_FEEDS:
                  try:
                      feed = feedparser.parse(feed_url)
                      logging.info(
                          "Feed %s: %s articoli",
                          feed_url, len(feed.entries)
                      )

                      for entry in feed.entries:
                          title = entry.get("title", "").strip()
                          url = normalize_url(entry.get("link", ""))
                          published = parse_date(
                              entry.get("published")
                              or entry.get("updated")
                          )

                          if not title or not url or not published:
                              continue

                          if published < NEWS_CUTOFF or published > NOW:
                              continue

                          if not is_relevant(title):
                              continue

                          if url in seen_this_run or url in state["news"]:
                              continue

                          combined = title.lower()
                          if any(word in combined for word in (
                              "playstation", "xbox", "gaming",
                              "videogame", "video game"
                          )):
                              continue

                          seen_this_run.add(url)
                          found.append({
                              "title": title,
                              "url": url,
                              "published": published
                          })
                  except Exception as exc:
                      logging.warning("Errore feed RSS: %s", exc)

              found.sort(
                  key=lambda item: item["published"],
                  reverse=True
              )
              return found[:5]

          def youtube_id(url):
              if not url:
                  return ""
              parts = urlsplit(url)
              if parts.netloc.endswith("youtu.be"):
                  return parts.path.strip("/")
              if "youtube.com" in parts.netloc:
                  return parse_qs(parts.query).get("v", [""])[0]
              return ""

          def collect_videos():
              videos = {}
              cutoff = (
                  NOW - timedelta(hours=24)
                  if FIRST_RUN else VIDEO_CUTOFF
              )

              def add_video(video_id, title, url, date):
                  if not video_id or not title or not date:
                      return
                  if date < cutoff or date > NOW:
                      return
                  if video_id in state["videos"]:
                      return
                  videos[video_id] = {
                      "id": video_id,
                      "title": title,
                      "url": url,
                      "date": date
                  }

              # Canale YouTube ufficiale
              try:
                  feed = feedparser.parse(OFFICIAL_YOUTUBE_RSS)
                  for entry in feed.entries:
                      url = entry.get("link", "")
                      video_id = (
                          entry.get("yt_videoid")
                          or youtube_id(url)
                      )
                      date = parse_date(
                          entry.get("published")
                          or entry.get("updated")
                      )
                      add_video(
                          video_id,
                          entry.get("title", ""),
                          url,
                          date
                      )
              except Exception as exc:
                  logging.warning("RSS YouTube ufficiale: %s", exc)

              # Altri video, interviste e performance
              searches = [
                  "The Weeknd interview",
                  "The Weeknd live performance",
                  "Abel Tesfaye interview"
              ]

              ydl_options = {
                  "quiet": True,
                  "no_warnings": True,
                  "extract_flat": True,
                  "skip_download": True,
                  "playlistend": 12,
                  "socket_timeout": 15
              }

              try:
                  with yt_dlp.YoutubeDL(ydl_options) as ydl:
                      for query in searches:
                          try:
                              result = ydl.extract_info(
                                  f"ytsearch8:{query}",
                                  download=False
                              )
                              for item in result.get("entries", []) or []:
                                  if not item:
                                      continue
                                  video_id = item.get("id", "")
                                  url = item.get("url", "")
                                  if video_id and not url.startswith("http"):
                                      url = (
                                          "https://www.youtube.com/watch?v="
                                          + video_id
                                      )

                                  date_string = (
                                      item.get("upload_date")
                                      or item.get("release_date")
                                  )
                                  date = None
                                  if date_string and len(date_string) == 8:
                                      try:
                                          date = datetime.strptime(
                                              date_string, "%Y%m%d"
                                          ).replace(tzinfo=timezone.utc)
                                      except Exception:
                                          pass

                                  add_video(
                                      video_id,
                                      item.get("title", ""),
                                      url,
                                      date
                                  )
                          except Exception as exc:
                              logging.warning(
                                  "Ricerca YouTube '%s': %s",
                                  query, exc
                              )
              except Exception as exc:
                  logging.warning("yt-dlp non disponibile: %s", exc)

              result = sorted(
                  videos.values(),
                  key=lambda item: item["date"],
                  reverse=True
              )
              return result[:8]

          def telegram_send(message):
              url = (
                  f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              )
              payload = {
                  "chat_id": CHAT_ID,
                  "message_thread_id": THREAD_ID,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }

              for attempt in range(3):
                  try:
                      response = SESSION.post(
                          url, json=payload, timeout=20
                      )
                      response.raise_for_status()
                      result = response.json()
                      if result.get("ok"):
                          return True
                      logging.error("Telegram: %s", result)
                  except Exception as exc:
                      logging.warning(
                          "Invio Telegram tentativo %s: %s",
                          attempt + 1, exc
                      )
                  if attempt < 2:
                      import time
                      time.sleep(3)

              return False

          def safe(text):
              return html.escape(str(text or ""), quote=False)

          def build_message(news, videos):
              parts = [
                  "🖤 <b>XO DAILY NEWS</b>",
                  "<i>Le ultime novità su The Weeknd</i>",
                  ""
              ]

              parts.append("📰 <b>NEWS</b>")
              if news:
                  for index, item in enumerate(news, 1):
                      parts.extend([
                          f"<b>{index}. {safe(item['title'])}</b>",
                          safe(summarize(article_text(item["url"]))),
                          f"🔗 <a href=\"{html.escape(item['url'], quote=True)}\">Leggi la notizia</a>",
                          ""
                      ])
              else:
                  parts.extend([
                      "Nessuna nuova notizia nelle ultime 24 ore.",
                      ""
                  ])

              parts.append("🎬 <b>YOUTUBE</b>")
              if videos:
                  for item in videos:
                      parts.extend([
                          f"▶️ <a href=\"{html.escape(item['url'], quote=True)}\">{safe(item['title'])}</a>",
                          ""
                      ])
              else:
                  parts.extend([
                      "Nessun nuovo video recente.",
                      ""
                  ])

              parts.append("📸 <b>INSTAGRAM</b>")
              for name, url in INSTAGRAM_LINKS:
                  parts.append(
                      f'• <a href="{url}">{safe(name)}</a>'
                  )

              parts.extend(["", "🖤 XO till we overdose!"])
              return "\n".join(parts)

          def main():
              logging.info("Avvio XO Daily News")
              logging.info("Prima esecuzione: %s", FIRST_RUN)

              news = collect_news()
              videos = collect_videos()

              logging.info(
                  "Nuove notizie: %s | Nuovi video: %s",
                  len(news), len(videos)
              )

              message = build_message(news, videos)

              if telegram_send(message):
                  for item in news:
                      state["news"][item["url"]] = NOW.isoformat()
                  for item in videos:
                      state["videos"][item["id"]] = NOW.isoformat()

                  save_state()
                  logging.info("Messaggio inviato e memoria aggiornata.")
              else:
                  logging.error(
                      "Invio non riuscito: memoria non aggiornata."
                  )
                  raise SystemExit(1)

          if __name__ == "__main__":
              main()
          PY
