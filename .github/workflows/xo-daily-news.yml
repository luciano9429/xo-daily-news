
name: XO Daily News

'on':
  schedule:
    - cron: '0 7,8 * * *'
  workflow_dispatch:

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Cerca notizie e nuovi video
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import html
          import json
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from difflib import SequenceMatcher
          from email.utils import parsedate_to_datetime

          TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = "-1004476534522"
          THREAD_ID = "40"

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; XODailyNews/1.0)"
          }

          now = datetime.now(ZoneInfo("Europe/Rome"))

          # Il controllo dell'ora vale solo per le esecuzioni automatiche.
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and now.hour != 9:
              print("Non sono le 09:00 in Italia: salto l'esecuzione.")
              raise SystemExit(0)

          cutoff_news = datetime.now(timezone.utc) - timedelta(hours=48)
          cutoff_video = datetime.now(timezone.utc) - timedelta(hours=24)

          def fetch(url, timeout=18):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read().decode(
                      response.headers.get_content_charset() or "utf-8",
                      errors="replace"
                  ), response.geturl()

          def clean(value):
              value = html.unescape(re.sub(r"<[^>]+>", " ", value or ""))
              return re.sub(r"\s+", " ", value).strip()

          def parse_date(value):
              if not value:
                  return None
              try:
                  return parsedate_to_datetime(value).astimezone(timezone.utc)
              except Exception:
                  try:
                      return datetime.fromisoformat(
                          value.replace("Z", "+00:00")
                      ).astimezone(timezone.utc)
                  except Exception:
                      return None

          def translate(text):
              if not text:
                  return ""
              try:
                  url = "https://translate.googleapis.com/translate_a/single?" + urllib.parse.urlencode({
                      "client": "gtx",
                      "sl": "auto",
                      "tl": "it",
                      "dt": "t",
                      "q": text[:1500]
                  })
                  data, _ = fetch(url, timeout=12)
                  result = json.loads(data)
                  return "".join(
                      part[0] for part in result[0] if part[0]
                  )
              except Exception as e:
                  print("Traduzione non disponibile:", str(e)[:120])
                  return text

          class ArticleParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
                  self.paragraphs = []
                  self.current = ""
                  self.in_paragraph = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "meta":
                      key = (
                          attrs.get("property")
                          or attrs.get("name")
                          or ""
                      ).lower()
                      value = attrs.get("content", "").strip()
                      if key and value:
                          self.meta[key] = value
                  elif tag == "p":
                      self.in_paragraph = True
                      self.current = ""

              def handle_data(self, data):
                  if self.in_paragraph:
                      self.current += data + " "

              def handle_endtag(self, tag):
                  if tag == "p" and self.in_paragraph:
                      paragraph = clean(self.current)
                      if len(paragraph) > 70:
                          self.paragraphs.append(paragraph)
                      self.in_paragraph = False
                      self.current = ""

          def get_summary(url, title):
              try:
                  page, _ = fetch(url)
                  parser = ArticleParser()
                  parser.feed(page[:1000000])

                  description = (
                      parser.meta.get("og:description")
                      or parser.meta.get("twitter:description")
                      or parser.meta.get("description")
                      or ""
                  )
                  description = clean(description)

                  if (
                      not description
                      or SequenceMatcher(
                          None, description.lower(), title.lower()
                      ).ratio() > 0.72
                  ):
                      candidates = [
                          p for p in parser.paragraphs
                          if len(p) > 90
                          and SequenceMatcher(
                              None, p.lower(), title.lower()
                          ).ratio() < 0.72
                      ]
                      description = candidates[0] if candidates else ""

                  if not description:
                      return ""

                  description = clean(translate(description))

                  if len(description) > 360:
                      description = (
                          description[:357].rsplit(" ", 1)[0] + "..."
                      )

                  return description

              except Exception as e:
                  print("Descrizione non recuperata:", str(e)[:120])
                  return ""

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          # -------------------------------------------------
          # NOTIZIE: Google News RSS
          # -------------------------------------------------

          news = []
          seen = set()

          query = '"The Weeknd" OR "Abel Tesfaye" when:2d'
          news_url = "https://news.google.com/rss/search?" + urllib.parse.urlencode({
              "q": query,
              "hl": "it",
              "gl": "IT",
              "ceid": "IT:it"
          })

          try:
              feed, _ = fetch(news_url)
              root = ET.fromstring(feed)

              for item in root.findall(".//item"):
                  title = clean(item.findtext("title", ""))
                  link = item.findtext("link", "").strip()
                  description = clean(item.findtext("description", ""))
                  source_el = item.find("source")
                  source = clean(
                      source_el.text if source_el is not None else ""
                  )

                  if not title or not link:
                      continue

                  searchable = (title + " " + description).lower()
                  if (
                      "the weeknd" not in searchable
                      and "abel tesfaye" not in searchable
                  ):
                      continue

                  published = parse_date(item.findtext("pubDate", ""))
                  if published and published < cutoff_news:
                      continue

                  key = re.sub(r"[^a-z0-9]", "", title.lower())
                  if key in seen:
                      continue
                  seen.add(key)

                  if source:
                      title = re.sub(
                          r"\s*[-|–]\s*" + re.escape(source) + r"\s*$",
                          "",
                          title,
                          flags=re.IGNORECASE
                      )

                  news.append({
                      "title": title,
                      "link": link,
                      "source": source or "Fonte originale"
                  })

                  if len(news) >= 5:
                      break

          except Exception as e:
              print("Errore nel feed notizie:", str(e)[:200])

          # -------------------------------------------------
          # VIDEO: feed RSS del canale YouTube ufficiale
          # -------------------------------------------------

          videos = []
          youtube_url = (
              "https://www.youtube.com/feeds/videos.xml"
              "?channel_id=UC0WP5P-ufpRfjbNrmOWwLBQ"
          )

          try:
              feed, _ = fetch(youtube_url)
              root = ET.fromstring(feed)

              ns = {
                  "atom": "http://www.w3.org/2005/Atom",
                  "yt": "http://www.youtube.com/xml/schemas/2015"
              }

              for entry in root.findall("atom:entry", ns):
                  title = clean(entry.findtext("atom:title", "", ns))
                  link_el = entry.find("atom:link", ns)
                  link = (
                      link_el.attrib.get("href", "")
                      if link_el is not None else ""
                  )
                  published_text = entry.findtext(
                      "atom:published", "", ns
                  )
                  published = parse_date(published_text)

                  if not title or not link:
                      continue

                  if published and published < cutoff_video:
                      continue

                  videos.append({
                      "title": title,
                      "link": link
                  })

                  if len(videos) >= 5:
                      break

          except Exception as e:
              print("Errore nel feed YouTube:", str(e)[:200])

          # -------------------------------------------------
          # COMPOSIZIONE DEL MESSAGGIO TELEGRAM
          # -------------------------------------------------

          lines = [
              "<b>📰 XO DAILY NEWS</b>",
              "<i>Le ultime notizie su The Weeknd</i>",
              ""
          ]

          if news:
              for index, article in enumerate(news, 1):
                  summary = get_summary(
                      article["link"], article["title"]
                  )

                  lines.append(
                      f"<b>{index}. {esc(article['title'])}</b>"
                  )
                  lines.append(
                      f"<i>Fonte: {esc(article['source'])}</i>"
                  )

                  if summary:
                      lines.append(esc(summary))
                  else:
                      lines.append(
                          "<i>Apri la fonte per leggere i dettagli.</i>"
                      )

                  lines.append(
                      f'<a href="{esc(article["link"])}">Leggi la notizia</a>'
                  )
                  lines.append("")
          else:
              lines.append("Nessuna nuova notizia trovata.")
              lines.append("")

          if videos:
              lines.append("<b>🎬 NUOVI VIDEO YOUTUBE</b>")
              lines.append("")

              for video in videos:
                  lines.append(f"<b>{esc(video['title'])}</b>")
                  lines.append(
                      f'<a href="{esc(video["link"])}">Guarda il video</a>'
                  )
                  lines.append("")
          else:
              lines.append("<b>🎬 NUOVI VIDEO YOUTUBE</b>")
              lines.append("Nessun nuovo video nelle ultime 24 ore.")
              lines.append("")

          lines.extend([
              "📸 <b>INSTAGRAM</b>",
              '<a href="https://www.instagram.com/theweeknd/">Profilo ufficiale @theweeknd</a>',
              '<a href="https://www.instagram.com/abelspost/">Fanpage @abelspost</a>'
          ])

          message = "\n".join(lines)

          if len(message) > 3800:
              message = (
                  message[:3750]
                  + "\n\n<i>Consulta i link per gli altri contenuti.</i>"
              )

          # -------------------------------------------------
          # INVIO NEL TOPIC TELEGRAM
          # -------------------------------------------------

          api_url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

          payload = urllib.parse.urlencode({
              "chat_id": CHAT_ID,
              "message_thread_id": THREAD_ID,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": "false"
          }).encode()

          req = urllib.request.Request(
              api_url,
              data=payload,
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=25) as response:
              result = json.loads(response.read().decode())

          if not result.get("ok"):
              raise RuntimeError(
                  "Telegram non ha accettato il messaggio: "
                  + str(result)
              )

          print(
              f"Pubblicazione riuscita: {len(news)} notizie, "
              f"{len(videos)} video."
          )
          PY
          
