name: XO Daily News - Test Google

'on':
  schedule:
    - cron: '15 9 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xo-google-news-test
  cancel-in-progress: false

jobs:
  test-google-news:
    runs-on: ubuntu-latest

    steps:
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          pip install requests feedparser beautifulsoup4

      - name: Test ricerca Google News
        run: |
          python <<'PY'
          import requests
          import feedparser
          import urllib.parse
          import json
          import re
          import logging
          import time
          from datetime import datetime, timedelta, timezone
          from difflib import SequenceMatcher
          from email.utils import parsedate_to_datetime
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse as parse_url

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s %(levelname)s %(message)s"
          )

          NOW = datetime.now(timezone.utc)
          CUTOFF = NOW - timedelta(hours=24)
          MAX_ARTICLES = 5
          MAX_CANDIDATES = 50
          MAX_HTTP_ATTEMPTS = 4

          SESSION = requests.Session()
          SESSION.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 Chrome/120.0 Safari/537.36"
              )
          })

          def request_with_retry(method, url, **kwargs):
              """
              Ripete la richiesta in caso di HTTP 429.
              Rispetta Retry-After quando disponibile.
              Non riprova gli errori 403.
              """
              for attempt in range(1, MAX_HTTP_ATTEMPTS + 1):
                  response = method(url, **kwargs)

                  if response.status_code != 429:
                      return response

                  if attempt == MAX_HTTP_ATTEMPTS:
                      logging.error(
                          "HTTP 429 persistente dopo %s tentativi: %s",
                          MAX_HTTP_ATTEMPTS,
                          url
                      )
                      return response

                  retry_after = response.headers.get("Retry-After")
                  delay = None

                  if retry_after:
                      try:
                          delay = max(0, int(retry_after))
                      except ValueError:
                          try:
                              retry_date = parsedate_to_datetime(
                                  retry_after
                              )

                              if retry_date.tzinfo is None:
                                  retry_date = retry_date.replace(
                                      tzinfo=timezone.utc
                                  )

                              delay = max(
                                  0,
                                  int(
                                      (
                                          retry_date
                                          - datetime.now(timezone.utc)
                                      ).total_seconds()
                                  )
                              )
                          except Exception:
                              delay = None

                  if delay is None:
                      delay = 2 ** attempt

                  delay = min(delay, 30)

                  logging.warning(
                      "HTTP 429: tentativo %s/%s. "
                      "Nuovo tentativo tra %s secondi.",
                      attempt,
                      MAX_HTTP_ATTEMPTS,
                      delay
                  )

                  time.sleep(delay)

              return response

          # Ricerche ampie: USA, Regno Unito, Canada e Italia.
          QUERIES = [
              ('"The Weeknd"', "en-US", "US", "US:en"),
              ('"Abel Tesfaye"', "en-US", "US", "US:en"),
              ('"The Weeknd"', "en-GB", "GB", "GB:en"),
              ('"Abel Tesfaye"', "en-GB", "GB", "GB:en"),
              ('"The Weeknd"', "en-CA", "CA", "CA:en"),
              ('"Abel Tesfaye"', "en-CA", "CA", "CA:en"),
              ('"The Weeknd"', "it", "IT", "IT:it"),
              ('"Abel Tesfaye"', "it", "IT", "IT:it"),
          ]

          ARTIST_RE = re.compile(
              r"\bthe\s+weeknd\b|\babel\s+tesfaye\b",
              re.IGNORECASE
          )

          STOP_WORDS = {
              "the", "and", "for", "with", "from", "that",
              "this", "his", "her", "new", "about", "after",
              "before", "weeknd", "abel", "tesfaye",
              "una", "uno", "con", "per", "della", "delle",
              "degli", "dallo", "dalla", "dalle", "del",
              "nel", "nella", "sul", "sulla", "che",
              "come", "sono", "sua", "suo", "their",
              "has", "have", "had", "was", "were",
              "its", "they", "them", "video", "star",
              "starring", "team", "teams", "features",
              "featuring", "unreleased"
          }

          SOURCE_PRIORITY = {
              "complex.com": 1,
              "billboard.com": 1,
              "rollingstone.com": 1,
              "pitchfork.com": 1,
              "variety.com": 1,
              "hollywoodreporter.com": 1,
              "reuters.com": 1,
              "apnews.com": 1,
              "bbc.com": 1,
              "bbc.co.uk": 1,
              "theguardian.com": 1,
              "nme.com": 2,
              "people.com": 2,
              "timesofindia.indiatimes.com": 2,
              "trendyhiphop.com": 3,
              "power98.com.sg": 3,
              "footyheadlines.com": 4
          }

          def get_domain(url):
              try:
                  return parse_url(url).netloc.lower().replace(
                      "www.", ""
                  )
              except Exception:
                  return ""

          def source_priority(url):
              domain = get_domain(url)

              for known_domain, priority in SOURCE_PRIORITY.items():
                  if (
                      domain == known_domain
                      or domain.endswith("." + known_domain)
                  ):
                      return priority

              return 3

          def parse_date(value):
              if not value:
                  return None

              try:
                  cleaned = str(value).strip()
                  cleaned_iso = cleaned.replace("Z", "+00:00")
                  dt = datetime.fromisoformat(cleaned_iso)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt.astimezone(timezone.utc)

              except Exception:
                  pass

              try:
                  dt = parsedate_to_datetime(value)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt.astimezone(timezone.utc)

              except Exception:
                  pass

              for fmt in (
                  "%Y-%m-%d",
                  "%Y/%m/%d",
                  "%d/%m/%Y",
                  "%B %d, %Y",
                  "%b %d, %Y"
              ):
                  try:
                      dt = datetime.strptime(
                          str(value).strip(), fmt
                      )
                      return dt.replace(tzinfo=timezone.utc)
                  except Exception:
                      continue

              return None

          def extract_jsonld_dates(data):
              dates = []

              if isinstance(data, list):
                  for item in data:
                      dates.extend(extract_jsonld_dates(item))

              elif isinstance(data, dict):
                  for key in ("datePublished", "dateCreated"):
                      value = data.get(key)

                      if isinstance(value, str):
                          parsed = parse_date(value)

                          if parsed:
                              dates.append(parsed)

                  graph = data.get("@graph")

                  if graph:
                      dates.extend(extract_jsonld_dates(graph))

              return dates

          def extract_original_publication_date(soup):
              dates = []

              for script in soup.find_all(
                  "script", type="application/ld+json"
              ):
                  try:
                      data = json.loads(
                          script.string or script.get_text()
                      )
                      dates.extend(extract_jsonld_dates(data))
                  except Exception:
                      continue

              date_attributes = [
                  ("property", "article:published_time"),
                  ("property", "og:published_time"),
                  ("name", "datePublished"),
                  ("name", "date"),
                  ("name", "pubdate"),
                  ("name", "publishdate"),
                  ("name", "publication_date"),
                  ("name", "parsely-pub-date"),
                  ("name", "sailthru.date"),
                  ("itemprop", "datePublished"),
              ]

              for attribute, expected in date_attributes:
                  tag = soup.find(
                      "meta",
                      attrs={attribute: expected}
                  )

                  if tag:
                      value = tag.get("content")

                      if value:
                          parsed = parse_date(value)

                          if parsed:
                              dates.append(parsed)

              for tag in soup.find_all("time"):
                  value = tag.get("datetime")

                  if value:
                      parsed = parse_date(value)

                      if parsed:
                          dates.append(parsed)

              if not dates:
                  return None

              return min(dates)

          def resolve_google_url(link):
              try:
                  parts = urllib.parse.urlsplit(link)

                  if "news.google.com" not in parts.netloc:
                      return link

                  article_id = (
                      parts.path.rstrip("/").split("/")[-1]
                  )

                  page = request_with_retry(
                      SESSION.get,
                      link,
                      timeout=25
                  )
                  page.raise_for_status()

                  match_sg = re.search(
                      r'data-n-a-sg="([^"]+)"',
                      page.text
                  )

                  match_ts = re.search(
                      r'data-n-a-ts="([^"]+)"',
                      page.text
                  )

                  if not match_sg or not match_ts:
                      logging.warning(
                          "Google non ha fornito i dati "
                          "per risolvere il link."
                      )
                      return None

                  sg = match_sg.group(1)
                  ts = match_ts.group(1)

                  inner = (
                      '["garturlreq",[["X","X",["X","X"],null,null,1,1,'
                      '"US:en",null,1,null,null,null,null,null,0,1],'
                      '"X","X",1,[1,1,1],1,1,null,0,0,null,0],'
                      f'"{article_id}",{ts},"{sg}"]'
                  )

                  payload = json.dumps(
                      [[["Fbv4je", inner, None, "generic"]]]
                  )

                  response = request_with_retry(
                      SESSION.post,
                      "https://news.google.com/_/DotsSplashUi/data/batchexecute",
                      params={"rpcids": "Fbv4je"},
                      data={"f.req": payload},
                      headers={
                          "Content-Type":
                          "application/x-www-form-urlencoded;charset=UTF-8"
                      },
                      timeout=25
                  )

                  response.raise_for_status()

                  raw = response.text.split("\n\n", 1)[-1].strip()

                  if raw.startswith(")]}'"):
                      raw = raw[4:].strip()

                  data = json.loads(raw)
                  row = data[0][2]

                  if not row:
                      return None

                  result = json.loads(row)
                  real_url = result[1]

                  if not real_url.startswith("https://"):
                      return None

                  return real_url

              except Exception as exc:
                  logging.warning(
                      "Risoluzione link non riuscita: %s",
                      exc
                  )
                  return None

          def get_article_data(url):
              try:
                  response = request_with_retry(
                      SESSION.get,
                      url,
                      timeout=20
                  )
                  response.raise_for_status()

                  soup = BeautifulSoup(
                      response.text, "html.parser"
                  )

                  publication_date = (
                      extract_original_publication_date(soup)
                  )

                  article_text = ""

                  for script in soup.find_all(
                      "script", type="application/ld+json"
                  ):
                      try:
                          data = json.loads(
                              script.string or script.get_text()
                          )

                          objects = (
                              data if isinstance(data, list)
                              else [data]
                          )

                          for obj in objects:
                              if isinstance(obj, dict):
                                  body = obj.get("articleBody")

                                  if body and len(body) > 100:
                                      article_text = body
                                      break

                          if article_text:
                              break

                      except Exception:
                          continue

                  if not article_text:
                      paragraphs = [
                          p.get_text(" ", strip=True)
                          for p in soup.find_all("p")
                      ]

                      article_text = " ".join(
                          p for p in paragraphs if len(p) > 40
                      )

                  return article_text, publication_date

              except requests.HTTPError as exc:
                  status = (
                      exc.response.status_code
                      if exc.response is not None
                      else "sconosciuto"
                  )

                  if status == 403:
                      logging.warning(
                          "Accesso negato (403): "
                          "il sito non consente la lettura automatica."
                      )
                  else:
                      logging.warning(
                          "Errore HTTP durante la lettura: %s",
                          exc
                      )

                  return "", None

              except Exception as exc:
                  logging.warning(
                      "Impossibile leggere l'articolo: %s",
                      exc
                  )
                  return "", None

          def title_tokens(title):
              normalized = title.lower()

              normalized = re.sub(
                  r"the\s+weeknd|abel\s+tesfaye",
                  " ",
                  normalized
              )

              normalized = re.sub(
                  r"paris[-\s]+saint[-\s]+germain",
                  " psg ",
                  normalized
              )

              normalized = re.sub(
                  r"grand\s+theft\s+auto\s+(?:vi|6)",
                  " gta ",
                  normalized
              )

              words = re.findall(
                  r"[a-z0-9à-ÿ]+",
                  normalized
              )

              return {
                  word for word in words
                  if len(word) > 2 and word not in STOP_WORDS
              }

          def is_psg_xo_collection(title):
              normalized = title.lower()

              has_psg = bool(
                  re.search(
                      r"\bpsg\b|paris[-\s]+saint[-\s]+germain",
                      normalized
                  )
              )

              has_xo = bool(re.search(r"\bxo\b", normalized))

              has_collection = bool(
                  re.search(
                      r"collection|collaboration|collab|lifestyle|"
                      r"apparel|clothing|fashion",
                      normalized
                  )
              )

              return has_psg and has_xo and has_collection

          def is_gta_justice_story(title):
              normalized = title.lower()

              has_gta = bool(
                  re.search(
                      r"\bgta\s*(?:vi|6)\b|"
                      r"\bgrand\s+theft\s+auto\s+(?:vi|6)\b",
                      normalized
                  )
              )

              has_justice = bool(
                  re.search(r"\bjustice\b", normalized)
              )

              has_weeknd = bool(ARTIST_RE.search(title))

              return has_gta and has_justice and has_weeknd

          def is_song_page(title):
              normalized = title.lower()

              track_listing = bool(
                  re.search(
                      r"the\s+weeknd\s*[–—-].{1,100}"
                      r"\b(?:ft\.?|feat\.?|featuring)\b",
                      normalized
                  )
              )

              page_markers = bool(
                  re.search(
                      r"\b(song lyrics|lyrics|official audio|"
                      r"official video|music video|mp3 download|"
                      r"download mp3|listen to|tracklist)\b",
                      normalized
                  )
              )

              return track_listing or page_markers

          def is_evergreen_content(title):
              normalized = title.lower()

              evergreen_patterns = [
                  r"\bwatch collection\b",
                  r"\bunconventional watch\b",
                  r"\bstyle guide\b",
                  r"\bfashion guide\b",
                  r"\bwardrobe\b",
                  r"\bmenswear\b",
                  r"\bmen's jewelry\b",
                  r"\bjewelry collection\b",
                  r"\btop \d+",
                  r"\bbest of\b",
                  r"\beverything you need to know\b",
                  r"\bcomplete guide\b",
              ]

              return any(
                  re.search(pattern, normalized)
                  for pattern in evergreen_patterns
              )

          def is_low_value_content(title):
              if is_song_page(title):
                  return "pagina musicale o scheda di una canzone"

              if is_evergreen_content(title):
                  return (
                      "contenuto evergreen, guida o "
                      "approfondimento non attuale"
                  )

              return None

          def same_story(title_a, title_b):
              if (
                  is_gta_justice_story(title_a)
                  and is_gta_justice_story(title_b)
              ):
                  return True

              if (
                  is_psg_xo_collection(title_a)
                  and is_psg_xo_collection(title_b)
              ):
                  return True

              a = title_tokens(title_a)
              b = title_tokens(title_b)

              if not a or not b:
                  return False

              common = a.intersection(b)

              if len(common) >= 3:
                  overlap = len(common) / min(len(a), len(b))

                  if overlap >= 0.60:
                      return True

              ratio = SequenceMatcher(
                  None,
                  " ".join(sorted(a)),
                  " ".join(sorted(b))
              ).ratio()

              return ratio >= 0.82

          def candidate_score(item):
              return (
                  -source_priority(item["url"]),
                  item["date"].timestamp(),
                  item["text_length"]
              )

          def main():
              results = {}

              for query, language, country, edition in QUERIES:
                  params = {
                      "q": query + " when:1d",
                      "hl": language,
                      "gl": country,
                      "ceid": edition
                  }

                  feed_url = (
                      "https://news.google.com/rss/search?"
                      + urllib.parse.urlencode(params)
                  )

                  logging.info(
                      "Ricerca Google News: %s (%s)",
                      query,
                      edition
                  )

                  try:
                      response = request_with_retry(
                          SESSION.get,
                          feed_url,
                          timeout=25
                      )
                      response.raise_for_status()

                      feed = feedparser.parse(response.content)

                      logging.info(
                          "Risultati RSS ricevuti: %s",
                          len(feed.entries)
                      )

                      for entry in feed.entries:
                          title = entry.get("title", "").strip()
                          published = parse_date(
                              entry.get("published")
                          )
                          link = entry.get("link", "")

                          if not title or not link or not published:
                              continue

                          if published < CUTOFF or published > NOW:
                              continue

                          key = title.lower()

                          if key not in results:
                              results[key] = {
                                  "title": title,
                                  "date": published,
                                  "google_link": link
                              }

                  except Exception as exc:
                      logging.error(
                          "Errore ricerca Google News: %s",
                          exc
                      )

              logging.info(
                  "Risultati unici nelle ultime 24 ore: %s",
                  len(results)
              )

              ordered = sorted(
                  results.values(),
                  key=lambda x: x["date"],
                  reverse=True
              )

              candidates = []

              rejected_title = 0
              rejected_text = 0
              rejected_link = 0
              rejected_duplicate = 0
              rejected_old_date = 0
              rejected_future_date = 0
              rejected_unknown_date = 0
              rejected_evergreen = 0

              for item in ordered[:MAX_CANDIDATES]:
                  title = item["title"]

                  logging.info("-" * 60)
                  logging.info("Controllo: %s", title)

                  if not ARTIST_RE.search(title):
                      rejected_title += 1
                      logging.info(
                          "SCARTATO: il titolo non cita direttamente l'artista."
                      )
                      continue

                  low_value_reason = is_low_value_content(title)

                  if low_value_reason:
                      rejected_evergreen += 1
                      logging.info(
                          "SCARTATO: %s.",
                          low_value_reason
                      )
                      continue

                  original_url = resolve_google_url(
                      item["google_link"]
                  )

                  if not original_url:
                      rejected_link += 1
                      logging.info(
                          "SCARTATO: link originale non risolto."
                      )
                      continue

                  text, original_date = get_article_data(
                      original_url
                  )

                  if not text:
                      rejected_text += 1
                      logging.info(
                          "SCARTATO: testo dell'articolo non accessibile."
                      )
                      continue

                  if not ARTIST_RE.search(text):
                      rejected_text += 1
                      logging.info(
                          "SCARTATO: il testo non conferma "
                          "il riferimento all'artista."
                      )
                      continue

                  if not original_date:
                      rejected_unknown_date += 1
                      logging.info(
                          "SCARTATO: data originale di pubblicazione "
                          "non verificabile."
                      )
                      continue

                  logging.info(
                      "Data originale articolo: %s",
                      original_date.isoformat()
                  )

                  if original_date < CUTOFF:
                      rejected_old_date += 1
                      logging.info(
                          "SCARTATO: articolo pubblicato oltre 24 ore fa."
                      )
                      continue

                  if original_date > NOW:
                      rejected_future_date += 1
                      logging.info(
                          "SCARTATO: data originale successiva all'esecuzione."
                      )
                      continue

                  candidate = {
                      "title": title,
                      "date": original_date,
                      "url": original_url,
                      "text_length": len(text),
                      "domain": get_domain(original_url)
                  }

                  candidates.append(candidate)

                  logging.info("CANDIDATO VALIDO")
                  logging.info("Titolo: %s", title)
                  logging.info("Fonte: %s", candidate["domain"])
                  logging.info(
                      "Priorità fonte: %s",
                      source_priority(original_url)
                  )

              candidates.sort(
                  key=candidate_score,
                  reverse=True
              )

              unique_candidates = []

              for candidate in candidates:
                  duplicate = next(
                      (
                          previous for previous in unique_candidates
                          if same_story(
                              candidate["title"],
                              previous["title"]
                          )
                      ),
                      None
                  )

                  if duplicate:
                      rejected_duplicate += 1

                      logging.info(
                          "DUPLICATO: '%s' viene accorpato a '%s'.",
                          candidate["title"],
                          duplicate["title"]
                      )
                      continue

                  unique_candidates.append(candidate)

              selected = unique_candidates[:MAX_ARTICLES]

              logging.info("=" * 60)
              logging.info("RIEPILOGO DEL TEST")
              logging.info(
                  "Candidati validi esaminati: %s",
                  len(candidates)
              )
              logging.info(
                  "Articoli unici dopo deduplicazione: %s",
                  len(unique_candidates)
              )
              logging.info(
                  "Articoli finali selezionati: %s",
                  len(selected)
              )
              logging.info(
                  "Scartati per titolo non pertinente: %s",
                  rejected_title
              )
              logging.info(
                  "Scartati per testo non accessibile/non pertinente: %s",
                  rejected_text
              )
              logging.info(
                  "Scartati come duplicati: %s",
                  rejected_duplicate
              )
              logging.info(
                  "Scartati per link non risolto: %s",
                  rejected_link
              )
              logging.info(
                  "Scartati per data originale troppo vecchia: %s",
                  rejected_old_date
              )
              logging.info(
                  "Scartati per data originale futura: %s",
                  rejected_future_date
              )
              logging.info(
                  "Scartati per data originale non verificabile: %s",
                  rejected_unknown_date
              )
              logging.info(
                  "Scartati come evergreen o pagine musicali: %s",
                  rejected_evergreen
              )

              if selected:
                  logging.info("ARTICOLI FINALI:")

                  for index, item in enumerate(selected, 1):
                      logging.info(
                          "%s. %s | Fonte: %s | Data: %s | %s",
                          index,
                          item["title"],
                          item["domain"],
                          item["date"].isoformat(),
                          item["url"]
                      )
              else:
                  logging.info(
                      "Nessun articolo ha superato tutti i controlli."
                  )

              logging.info("=" * 60)
              logging.info(
                  "TEST COMPLETATO. NESSUN MESSAGGIO TELEGRAM INVIATO."
              )

          main()
          PY
