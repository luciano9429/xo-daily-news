name: XO Daily News - Test Google

'on':
  schedule:
    - cron: '15 9 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xo-google-news-test
  cancel-in-progress: false

jobs:
  test-google-news:
    runs-on: ubuntu-latest

    steps:
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          pip install requests feedparser beautifulsoup4

      - name: Test ricerca Google News
        run: |
          python <<'PY'
          import requests
          import feedparser
          import urllib.parse
          import urllib.parse as urlparse
          import json
          import re
          import logging
          from datetime import datetime, timedelta, timezone
          from difflib import SequenceMatcher
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse as parse_url

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s %(levelname)s %(message)s"
          )

          NOW = datetime.now(timezone.utc)
          CUTOFF = NOW - timedelta(hours=24)
          MAX_ARTICLES = 5
          MAX_CANDIDATES = 30

          SESSION = requests.Session()
          SESSION.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 Chrome/120.0 Safari/537.36"
              )
          })

          QUERIES = [
              ('"The Weeknd"', "en-US", "US", "US:en"),
              ('"Abel Tesfaye"', "en-US", "US", "US:en"),
              ('"The Weeknd"', "it", "IT", "IT:it"),
              ('"Abel Tesfaye"', "it", "IT", "IT:it"),
          ]

          ARTIST_RE = re.compile(
              r"\bthe\s+weeknd\b|\babel\s+tesfaye\b",
              re.IGNORECASE
          )

          STOP_WORDS = {
              "the", "and", "for", "with", "from", "that",
              "this", "his", "her", "new", "about", "after",
              "before", "weeknd", "abel", "tesfaye",
              "una", "uno", "con", "per", "della", "delle",
              "degli", "dallo", "dalla", "dalle", "del",
              "nel", "nella", "sul", "sulla", "che",
              "come", "sono", "sua", "suo", "their",
              "has", "have", "had", "was", "were",
              "its", "his", "her", "they", "them",
              "video", "star", "starring"
          }

          # Preferenza indicativa delle fonti.
          # Un numero più basso indica una priorità maggiore.
          SOURCE_PRIORITY = {
              "complex.com": 1,
              "billboard.com": 1,
              "rollingstone.com": 1,
              "pitchfork.com": 1,
              "variety.com": 1,
              "hollywoodreporter.com": 1,
              "reuters.com": 1,
              "apnews.com": 1,
              "bbc.com": 1,
              "bbc.co.uk": 1,
              "theguardian.com": 1,
              "nme.com": 2,
              "people.com": 2,
              "timesofindia.indiatimes.com": 2,
              "trend yhiphop.com": 3,
              "power98.com.sg": 3,
              "footyheadlines.com": 4
          }

          def get_domain(url):
              try:
                  return parse_url(url).netloc.lower().replace("www.", "")
              except Exception:
                  return ""

          def source_priority(url):
              domain = get_domain(url)

              for known_domain, priority in SOURCE_PRIORITY.items():
                  if known_domain in domain:
                      return priority

              return 3

          def parse_date(value):
              if not value:
                  return None

              try:
                  from email.utils import parsedate_to_datetime
                  dt = parsedate_to_datetime(value)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt.astimezone(timezone.utc)

              except Exception:
                  return None

          def resolve_google_url(link):
              try:
                  parts = urlparse.urlsplit(link)

                  if "news.google.com" not in parts.netloc:
                      return link

                  article_id = parts.path.rstrip("/").split("/")[-1]

                  page = SESSION.get(link, timeout=25)
                  page.raise_for_status()

                  match_sg = re.search(
                      r'data-n-a-sg="([^"]+)"',
                      page.text
                  )

                  match_ts = re.search(
                      r'data-n-a-ts="([^"]+)"',
                      page.text
                  )

                  if not match_sg or not match_ts:
                      logging.warning(
                          "Google non ha fornito i dati per risolvere il link."
                      )
                      return None

                  sg = match_sg.group(1)
                  ts = match_ts.group(1)

                  inner = (
                      '["garturlreq",[["X","X",["X","X"],null,null,1,1,'
                      '"US:en",null,1,null,null,null,null,null,0,1],'
                      '"X","X",1,[1,1,1],1,1,null,0,0,null,0],'
                      f'"{article_id}",{ts},"{sg}"]'
                  )

                  payload = json.dumps(
                      [[["Fbv4je", inner, None, "generic"]]]
                  )

                  response = SESSION.post(
                      "https://news.google.com/_/DotsSplashUi/data/batchexecute",
                      params={"rpcids": "Fbv4je"},
                      data={"f.req": payload},
                      headers={
                          "Content-Type":
                          "application/x-www-form-urlencoded;charset=UTF-8"
                      },
                      timeout=25
                  )

                  response.raise_for_status()

                  raw = response.text.split("\n\n", 1)[-1].strip()

                  if raw.startswith(")]}'"):
                      raw = raw[4:].strip()

                  data = json.loads(raw)
                  row = data[0][2]

                  if not row:
                      return None

                  result = json.loads(row)
                  real_url = result[1]

                  if not real_url.startswith("https://"):
                      return None

                  return real_url

              except Exception as exc:
                  logging.warning(
                      "Risoluzione link non riuscita: %s", exc
                  )
                  return None

          def get_article_text(url):
              try:
                  response = SESSION.get(url, timeout=20)
                  response.raise_for_status()

                  soup = BeautifulSoup(
                      response.text, "html.parser"
                  )

                  for script in soup.find_all(
                      "script", type="application/ld+json"
                  ):
                      try:
                          data = json.loads(
                              script.string or script.get_text()
                          )

                          objects = (
                              data if isinstance(data, list)
                              else [data]
                          )

                          for obj in objects:
                              if isinstance(obj, dict):
                                  body = obj.get("articleBody")

                                  if body and len(body) > 100:
                                      return body

                      except Exception:
                          continue

                  paragraphs = [
                      p.get_text(" ", strip=True)
                      for p in soup.find_all("p")
                  ]

                  return " ".join(
                      p for p in paragraphs if len(p) > 40
                  )

              except Exception as exc:
                  logging.warning(
                      "Impossibile leggere l'articolo: %s", exc
                  )
                  return ""

          def title_tokens(title):
              normalized = title.lower()

              normalized = re.sub(
                  r"the\s+weeknd|abel\s+tesfaye",
                  " ",
                  normalized
              )

              # Uniforma le diverse forme del nome PSG.
              normalized = re.sub(
                  r"paris[-\s]+saint[-\s]+germain",
                  " psg ",
                  normalized
              )

              words = re.findall(
                  r"[a-z0-9à-ÿ]+",
                  normalized
              )

              return {
                  word for word in words
                  if len(word) > 2 and word not in STOP_WORDS
              }

          def is_psg_xo_collection(title):
              normalized = title.lower()

              has_psg = bool(
                  re.search(
                      r"\bpsg\b|paris[-\s]+saint[-\s]+germain",
                      normalized
                  )
              )

              has_xo = bool(re.search(r"\bxo\b", normalized))

              has_collection = bool(
                  re.search(
                      r"collection|collaboration|collab|lifestyle|"
                      r"apparel|clothing|fashion",
                      normalized
                  )
              )

              return has_psg and has_xo and has_collection

          def same_story(title_a, title_b):
              # Regola specifica per la collaborazione PSG–XO.
              if (
                  is_psg_xo_collection(title_a)
                  and is_psg_xo_collection(title_b)
              ):
                  return True

              a = title_tokens(title_a)
              b = title_tokens(title_b)

              if not a or not b:
                  return False

              common = a.intersection(b)

              if len(common) >= 3:
                  overlap = len(common) / min(len(a), len(b))

                  if overlap >= 0.60:
                      return True

              ratio = SequenceMatcher(
                  None,
                  " ".join(sorted(a)),
                  " ".join(sorted(b))
              ).ratio()

              return ratio >= 0.82

          def candidate_score(item):
              # Prima la priorità della fonte, poi la data,
              # infine la lunghezza del testo recuperato.
              return (
                  -source_priority(item["url"]),
                  item["date"].timestamp(),
                  item["text_length"]
              )

          def main():
              results = {}

              for query, language, country, edition in QUERIES:
                  params = {
                      "q": query + " when:1d",
                      "hl": language,
                      "gl": country,
                      "ceid": edition
                  }

                  feed_url = (
                      "https://news.google.com/rss/search?"
                      + urllib.parse.urlencode(params)
                  )

                  logging.info(
                      'Ricerca Google News: %s (%s)',
                      query, edition
                  )

                  try:
                      response = SESSION.get(
                          feed_url, timeout=25
                      )
                      response.raise_for_status()

                      feed = feedparser.parse(response.content)

                      logging.info(
                          "Risultati RSS ricevuti: %s",
                          len(feed.entries)
                      )

                      for entry in feed.entries:
                          title = entry.get("title", "").strip()
                          published = parse_date(
                              entry.get("published")
                          )
                          link = entry.get("link", "")

                          if not title or not link or not published:
                              continue

                          if published < CUTOFF or published > NOW:
                              continue

                          key = title.lower()

                          if key not in results:
                              results[key] = {
                                  "title": title,
                                  "date": published,
                                  "google_link": link
                              }

                  except Exception as exc:
                      logging.error(
                          "Errore ricerca Google News: %s", exc
                      )

              logging.info(
                  "Risultati unici nelle ultime 24 ore: %s",
                  len(results)
              )

              ordered = sorted(
                  results.values(),
                  key=lambda x: x["date"],
                  reverse=True
              )

              candidates = []

              rejected_title = 0
              rejected_text = 0
              rejected_link = 0
              rejected_duplicate = 0

              # Esamina tutti i candidati, senza fermarsi
              # appena ne trova cinque.
              for item in ordered[:MAX_CANDIDATES]:
                  title = item["title"]

                  logging.info("-" * 60)
                  logging.info("Controllo: %s", title)

                  if not ARTIST_RE.search(title):
                      rejected_title += 1
                      logging.info(
                          "SCARTATO: il titolo non cita direttamente l'artista."
                      )
                      continue

                  original_url = resolve_google_url(
                      item["google_link"]
                  )

                  if not original_url:
                      rejected_link += 1
                      logging.info(
                          "SCARTATO: link originale non risolto."
                      )
                      continue

                  text = get_article_text(original_url)

                  if not text:
                      rejected_text += 1
                      logging.info(
                          "SCARTATO: testo dell'articolo non accessibile."
                      )
                      continue

                  if not ARTIST_RE.search(text):
                      rejected_text += 1
                      logging.info(
                          "SCARTATO: il testo non conferma il riferimento all'artista."
                      )
                      continue

                  candidate = {
                      "title": title,
                      "date": item["date"],
                      "url": original_url,
                      "text_length": len(text),
                      "domain": get_domain(original_url)
                  }

                  candidates.append(candidate)

                  logging.info("CANDIDATO VALIDO")
                  logging.info("Titolo: %s", title)
                  logging.info("Fonte: %s", candidate["domain"])
                  logging.info(
                      "Priorità fonte: %s",
                      source_priority(original_url)
                  )

              # Ordina i candidati in base alla priorità
              # della fonte e poi alla data.
              candidates.sort(
                  key=candidate_score,
                  reverse=True
              )

              # Deduplicazione dopo aver esaminato tutti
              # gli articoli validi.
              unique_candidates = []

              for candidate in candidates:
                  duplicate = next(
                      (
                          previous for previous in unique_candidates
                          if same_story(
                              candidate["title"],
                              previous["title"]
                          )
                      ),
                      None
                  )

                  if duplicate:
                      rejected_duplicate += 1

                      logging.info(
                          "DUPLICATO: '%s' viene accorpato a '%s'.",
                          candidate["title"],
                          duplicate["title"]
                      )
                      continue

                  unique_candidates.append(candidate)

              # I migliori cinque articoli dopo la deduplicazione.
              selected = unique_candidates[:MAX_ARTICLES]

              logging.info("=" * 60)
              logging.info("RIEPILOGO DEL TEST")
              logging.info(
                  "Candidati validi esaminati: %s",
                  len(candidates)
              )
              logging.info(
                  "Articoli unici dopo deduplicazione: %s",
                  len(unique_candidates)
              )
              logging.info(
                  "Articoli finali selezionati: %s",
                  len(selected)
              )
              logging.info(
                  "Scartati per titolo non pertinente: %s",
                  rejected_title
              )
              logging.info(
                  "Scartati per testo non accessibile/non pertinente: %s",
                  rejected_text
              )
              logging.info(
                  "Scartati come duplicati: %s",
                  rejected_duplicate
              )
              logging.info(
                  "Scartati per link non risolto: %s",
                  rejected_link
              )

              if selected:
                  logging.info("ARTICOLI FINALI:")

                  for index, item in enumerate(selected, 1):
                      logging.info(
                          "%s. %s | Fonte: %s | %s",
                          index,
                          item["title"],
                          item["domain"],
                          item["url"]
                      )
              else:
                  logging.info(
                      "Nessun articolo ha superato tutti i controlli."
                  )

              logging.info("=" * 60)
              logging.info(
                  "TEST COMPLETATO. NESSUN MESSAGGIO TELEGRAM INVIATO."
              )

          main()
          PY
